<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>소개 미리보기 2차 D2</title>
<link rel="stylesheet" href="tokens.css">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--color-bg-page);color:var(--color-fg-primary);font:400 14px/1.6 var(--font-sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ic{display:inline-block;flex:none;width:var(--s,20px);height:var(--s,20px);background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
.i-back{--m:var(--ic-chevron-left-large);--s:24px}.i-next{--m:var(--ic-chevron-right);--s:20px}.i-down{--m:var(--ic-chevron-down);--s:16px}
.app{position:relative;height:100%;max-width:430px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;background:var(--color-bg-page)}
.top{flex:none;height:52px;padding:0 20px;display:flex;align-items:center;justify-content:space-between}
.back{width:44px;height:44px;margin-left:-10px;border:0;background:none;display:grid;place-items:center}
.back .ic{transform:translateX(-8px)}
.cnt{font-size:12px;color:var(--color-fg-accent-strong);font-variant-numeric:tabular-nums}
.gauge{flex:none;height:3px;margin:0 20px;border-radius:3px;background:var(--color-bg-notice);overflow:hidden}
.gauge i{display:block;width:100%;height:100%;background:var(--color-bg-button-primary)}
.body{flex:1;min-height:0;overflow-y:auto;padding:28px 20px 32px;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
h1{margin:0;font:400 28px/1.45 var(--font-serif);letter-spacing:-.5px}
.lead{margin:12px 0 0;font-size:13px;line-height:1.7;color:var(--color-fg-tertiary)}
.lead small{display:block;font-size:11px;color:var(--color-fg-subtle)}
.photo{position:relative;margin-top:28px;height:330px;border-radius:90px 90px 18px 18px;overflow:hidden;background:var(--color-bg-notice)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .arrow{position:absolute;right:8px;top:50%;margin-top:-22px;width:44px;height:44px;border:0;border-radius:50%;background:color-mix(in srgb,var(--white) 82%,transparent);display:grid;place-items:center;color:var(--color-fg-primary)}
.photo .count{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);padding:2px 8px;border-radius:10px;background:color-mix(in srgb,var(--cool-neutral-900) 45%,transparent);color:var(--white);font-size:11px;font-variant-numeric:tabular-nums}
.me{scroll-margin-top:96px}
.qa{margin-top:40px}
.qa h3{margin:0 0 8px;font:400 19px/1.7 var(--font-serif);color:var(--color-fg-accent-strong)}
.qa p{margin:0;font-size:14px;line-height:2;color:var(--color-fg-secondary)}
.bottom{flex:none;padding:12px 20px calc(20px + env(safe-area-inset-bottom,0px));background:var(--color-bg-page);box-shadow:0 -1px 0 var(--color-border-default)}
.cta{width:100%;height:52px;border:0;border-radius:14px;background:var(--color-bg-button-primary);color:var(--white);font-size:15px;font-weight:600}
.fi{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

.r-name{margin:28px 0 0;font:400 30px/1.3 var(--font-serif);letter-spacing:-.5px}
.r-meta{display:flex;align-items:center;gap:4px;margin:8px 0 0;font-size:14px;color:var(--color-fg-secondary)}
.r-meta .fi{width:16px;height:16px;color:var(--color-fg-tertiary)}
.r-meta i{width:2px;height:2px;margin:0 4px;border-radius:50%;background:var(--color-fg-subtle)}
.r-tags{display:flex;flex-wrap:wrap;gap:4px 12px;margin:12px 0 0;padding:0;list-style:none;font-size:13px;color:var(--color-fg-accent-strong)}
.r-h{margin:0 0 12px;font-size:12px;font-weight:500;color:var(--color-fg-tertiary)}

.d-note{position:relative;margin-top:36px;padding:28px 20px 12px 28px;border-radius:4px 4px 16px 4px;background:var(--color-bg-surface);box-shadow:var(--story-note-shadow);
 background-image:linear-gradient(90deg,transparent 15px,var(--story-note-margin) 15px 16px,transparent 16px),repeating-linear-gradient(transparent 0 27px,var(--story-note-rule) 27px 28px);background-position:0 0,0 19px}
.d-tapes{display:flex;flex-wrap:wrap;gap:6px 8px;margin:-42px -4px 12px -12px;padding:0;list-style:none}
.d-tapes li{padding:2px 10px;font-size:12px;line-height:20px;font-weight:500;transform:rotate(var(--r))}
.d-tapes li:nth-child(4n+1){background:var(--story-tape-1);color:var(--story-tape-1-fg);--r:-2deg}
.d-tapes li:nth-child(4n+2){background:var(--story-tape-2);color:var(--story-tape-2-fg);--r:1.5deg}
.d-tapes li:nth-child(4n+3){background:var(--story-tape-3);color:var(--story-tape-3-fg);--r:-1deg}
.d-tapes li:nth-child(4n+4){background:var(--story-tape-4);color:var(--story-tape-4-fg);--r:2deg}
.d-sign{margin:0;text-align:right;font:400 13px/28px var(--font-serif);color:var(--color-fg-tertiary)}

.d2-title{margin:0;font:500 11px/28px var(--font-sans);letter-spacing:2px;color:var(--color-fg-subtle)}
.d2-form{display:grid;grid-template-columns:repeat(6,1fr);column-gap:12px}
.d2-form .f{display:flex;align-items:baseline;gap:8px;height:56px;padding-top:6px;flex-direction:column;justify-content:flex-start}
.d2-form .f small{font-size:11px;line-height:16px;color:var(--color-fg-tertiary)}
.d2-form .f b{font:400 16px/28px var(--font-serif);color:var(--color-fg-accent-strong);margin-top:-2px}
.d2-form .f{grid-column:span 2}
.d2-form .f:nth-child(n+4){grid-column:span 3}
.d2-form .f.is-empty b{color:var(--color-fg-disabled,var(--color-fg-subtle))}

</style></head><body><div class="app">
<div class="top"><button type="button" class="back" aria-label="이전 화면"><i class="ic i-back" aria-hidden="true"></i></button><span class="cnt">5 / 5</span></div>
<div class="gauge"><i></i></div>
<div class="body" id="body">
<h1>당신의 첫 소개,<br>이렇게 보여요.</h1>
<p class="lead">상대방에게 보여줄 첫 소개예요.<small>가상 정보와 예시 사진을 사용한 시연용 프로필 · 사진을 옆으로 넘겨보세요</small></p>
<div class="photo"><img src="img/p1.jpg" alt="내 대표 사진"><button type="button" class="arrow" aria-label="다음 사진"><i class="ic i-next" aria-hidden="true"></i></button><span class="count">1 / 5</span></div>
<section class="me" id="me" aria-label="나의 정보">
<h2 class="r-name">하늘</h2><p class="r-meta"><svg class="fi" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6-6-6-11a6 6 0 0 1 12 0c0 5-6 11-6 11ZM12 8.5v3"/></svg>서울<i></i>여성</p>
<div class="d-note"><ul class="d-tapes" aria-label="해시태그"><li>#산책메이트</li><li>#카페탐방러</li><li>#다정한사람</li><li>#에겐녀</li><li>#필름감성</li></ul><p class="d2-title">ABOUT ME</p><div class="d2-form" data-form></div><p class="d-sign">— 하늘 씀</p></div>
</section>
<section class="qa"><h3>“간단한 자기소개를 들려주세요”</h3><p>서울에서 일하는 하늘이에요. 주말에는 동네 카페를 찾거나 산책하며 여유로운 시간을 보내는 걸 좋아해요.</p></section>
</div>
<div class="bottom"><button type="button" class="cta">이 소개로 완성하기</button></div>
</div>
<script>
/* 비교 페이지에서 #me로 열면 이름 영역부터 보이게 */
if(location.hash==='#me'){const b=document.getElementById('body'),m=document.getElementById('me');requestAnimationFrame(()=>{b.scrollTop=m.offsetTop-b.offsetTop-80;});}

const FULL={job:'직장인',height:'168',mbti:'INFP',edu:'대학교 졸업',religion:'무교',smoking:'비흡연',drinking:'가끔'};
const SPARSE={job:'직장인',height:'168'};
const JOB={'직장인':'회사에서 일하는','자영업':'내 가게를 꾸리는','프리랜서':'프리랜서로 일하는','전문직':'전문직으로 일하는','학생':'공부하는'};
const DRINK={'마시지 않아요':'술은 <mark>마시지 않아요</mark>','가끔':'술은 <mark>가끔</mark> 마셔요','즐기는 편이에요':'술은 <mark>즐기는 편</mark>이에요'};
const SMOKE={'비흡연':'담배는 <mark>피우지 않아요</mark>','가끔':'담배는 <mark>가끔</mark> 피워요','흡연':'담배를 <mark>피워요</mark>','전자담배':'<mark>전자담배</mark>를 피워요'};
const REL=v=>v==='무교'?'종교는 <mark>없어요</mark>':v==='기타'?'종교가 <mark>있어요</mark>':`<mark>${v}</mark>를 믿어요`;
const EDU={'고등학교 졸업':'<mark>고등학교</mark>를 졸업했어요','대학교 재학':'<mark>대학교</mark>에 다니고 있어요','대학교 졸업':'<mark>대학교</mark>를 졸업했어요','대학원 재학·졸업':'<mark>대학원</mark>에서 공부했어요'};
function sentence(d){
  const out=[];const j=JOB[d.job]||'';
  if(d.mbti&&d.mbti!=='잘 모르겠어요')out.push(`${j?j+' ':''}<mark>${d.mbti}</mark>예요`);
  else if(j)out.push(`<mark>${j}</mark> 사람이에요`);
  if(d.height)out.push(`키는 <mark>${d.height}cm</mark>예요`);
  if(d.drinking)out.push(DRINK[d.drinking]);
  if(d.smoking)out.push(SMOKE[d.smoking]);
  if(d.religion)out.push(REL(d.religion));
  if(d.edu)out.push(EDU[d.edu]);
  return out.map(s=>s+'.').join(' ');
}
const FIELDS=[['하는 일','job'],['키','height'],['성격','mbti'],['술','drinking'],['담배','smoking'],['종교','religion'],['학력','edu']];
function render(){const d=location.hash==='#sparse'?SPARSE:FULL;document.querySelectorAll('[data-say]').forEach(el=>el.innerHTML=sentence(d));
 document.querySelectorAll('[data-form]').forEach(el=>el.innerHTML=FIELDS.map(([l,k])=>{let v=d[k]||'';if(k==='height'&&v)v+='cm';return `<div class="f${v?'':' is-empty'}"><small>${l}</small><b>${v||'—'}</b></div>`;}).join(''));}
render();addEventListener('hashchange',()=>{render();const b=document.getElementById('body'),m=document.getElementById('me');b.scrollTop=m.offsetTop-b.offsetTop-80;});
if(location.hash==='#sparse'){const b=document.getElementById('body'),m=document.getElementById('me');requestAnimationFrame(()=>{b.scrollTop=m.offsetTop-b.offsetTop-80;});}

</script></body></html>
