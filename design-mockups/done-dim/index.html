<meta charset="utf-8">
<title>편지 · 교환 모션 막</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@font-face{font-family:'Pretendard';src:url('PretendardVariable.woff2') format('woff2');font-weight:100 900;font-display:swap}
/* 레이아웃: 머리(같이 고친 점) → 지금 · A · B · C 네 장 */
:root{--page:#F3F5F7;--ink:#1F2328;--ink-2:#5B636B;--line:#DDE2E7;--chip:#E9EDF1;--tag-new:#377398;--sans:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#14171A;--ink:#EEF1F4;--ink-2:#A3ACB5;--line:#2C3238;--chip:#262C32;--tag-new:#8CC0DF;color-scheme:dark}}
:root[data-theme="dark"]{--page:#14171A;--ink:#EEF1F4;--ink-2:#A3ACB5;--line:#2C3238;--chip:#262C32;--tag-new:#8CC0DF;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 56px}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:22px}
h1{font:700 22px/1.35 var(--sans);margin:0 0 6px}
ul{margin:0;padding-left:18px;color:var(--ink-2);display:grid;gap:4px;max-width:76ch}
ul b{color:var(--ink);font-weight:600}
.row{display:grid;grid-template-columns:repeat(4,minmax(0,270px));gap:20px}
figure{margin:0;display:grid;gap:8px;min-width:0;align-content:start}
figure img{width:100%;border-radius:20px;border:1px solid var(--line);display:block;background:#fff}
figcaption{font-size:13px;color:var(--ink-2)}
figcaption b{color:var(--ink)}
.tag{font:600 11px/1 var(--sans);padding:5px 8px;border-radius:6px;background:var(--chip);color:var(--ink-2);margin-right:6px}
.tag.new{background:var(--tag-new);color:#fff}
@media (max-width:900px){.row{grid-template-columns:repeat(2,minmax(0,1fr))}}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{height:40px;padding:0 16px;border:0;border-radius:12px;background:#377398;color:#fff;font:600 14px/1 var(--sans);cursor:pointer}
.btn.ghost{background:var(--chip);color:var(--ink)}
.phones{display:grid;grid-template-columns:repeat(2,260px);gap:24px;justify-content:start}
section{display:grid;gap:12px}
h2{font:700 18px/1.4 var(--sans);margin:0}

@media (max-width:600px){.phones{grid-template-columns:260px;justify-content:center}}
.ph{display:grid;gap:10px;align-content:start;min-width:0}
.ph-box{width:260px;height:563px;border-radius:24px;overflow:hidden;border:1px solid var(--line);background:#fff}
.phone{position:relative;width:360px;height:780px;overflow:hidden;transform:scale(.7222);transform-origin:0 0;--font-sans:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;--layout-gutter:20px}
.phone img.scene{position:absolute;inset:0;width:100%;height:100%;display:block;border:0;border-radius:0}
.ph .btn{justify-self:start}
.ph figcaption{min-height:40px}
.v-B .lb-heart svg path{fill:#B26073}
.v-B .lb-spark svg path{fill:#DDAFB7}
.v-B .lb-msg b{color:#273037}
.v-B .lb-msg small{color:#377398}
.lb-card{position:absolute;left:50%;width:232px;height:236px;margin-left:-116px;border-radius:28px;background:#fff;box-shadow:0 20px 48px -12px rgba(26,33,38,.4),0 2px 8px rgba(26,33,38,.12)}
</style>
<div class="wrap">
  <header>
    <h1>편지 · 교환 모션 · 막 색</h1>
    <ul>
      <li><b>호감 · 서로 호감</b>은 어두운 막으로 바꿨어요(넣음). 남은 세 순간도 같은 막으로 맞추면 네 모션이 한 결이 돼요.</li>
      <li>앱의 실제 모션 코드 그대로 재생해요. 바뀌는 건 막 색뿐이고, 편지가 날아가는 움직임 · 두 동그라미 · 글 · 머무는 시간은 같아요.</li>
      <li>교환 요청은 지금도 진한 회색이라 차이가 작아요. 94% → 58%로 뒤 화면이 비쳐 보이는 것만 달라져요.</li>
    </ul>
  </header>
  <div class="bar"><button class="btn" type="button" id="all">모두 함께 보기</button></div>
  <section><h2>편지 보냄</h2><div class="phones">
<figure class="ph"><div class="ph-box"><div class="phone" data-k="letter" data-v="now"><img class="scene" src="img/scene.jpg" alt=""></div></div><figcaption><span class="tag">지금</span>파랑 방사형 막 100%</figcaption><button class="btn ghost" type="button" data-play="letter:now">다시 보기</button></figure>
<figure class="ph"><div class="ph-box"><div class="phone" data-k="letter" data-v="dim"><img class="scene" src="img/scene.jpg" alt=""></div></div><figcaption><span class="tag new">바꾼 안</span><b>어두운 막</b> · 호감과 같은 cool-neutral-900 58%</figcaption><button class="btn ghost" type="button" data-play="letter:dim">다시 보기</button></figure>
</div></section><section><h2>교환 요청 보냄</h2><div class="phones">
<figure class="ph"><div class="ph-box"><div class="phone" data-k="request" data-v="now"><img class="scene" src="img/scene.jpg" alt=""></div></div><figcaption><span class="tag">지금</span>진한 회색 막 94%</figcaption><button class="btn ghost" type="button" data-play="request:now">다시 보기</button></figure>
<figure class="ph"><div class="ph-box"><div class="phone" data-k="request" data-v="dim"><img class="scene" src="img/scene.jpg" alt=""></div></div><figcaption><span class="tag new">바꾼 안</span><b>어두운 막</b> · 호감과 같은 cool-neutral-900 58%</figcaption><button class="btn ghost" type="button" data-play="request:dim">다시 보기</button></figure>
</div></section><section><h2>교환 수락</h2><div class="phones">
<figure class="ph"><div class="ph-box"><div class="phone" data-k="accept" data-v="now"><img class="scene" src="img/scene.jpg" alt=""></div></div><figcaption><span class="tag">지금</span>파랑 방사형 막 100%</figcaption><button class="btn ghost" type="button" data-play="accept:now">다시 보기</button></figure>
<figure class="ph"><div class="ph-box"><div class="phone" data-k="accept" data-v="dim"><img class="scene" src="img/scene.jpg" alt=""></div></div><figcaption><span class="tag new">바꾼 안</span><b>어두운 막</b> · 호감과 같은 cool-neutral-900 58%</figcaption><button class="btn ghost" type="button" data-play="accept:dim">다시 보기</button></figure>
</div></section>
</div>
<img id="my-page-photo" src="img/me.jpg" alt="" hidden>
<script src="motion.js"></script>
<script>
const DIM='rgba(26,33,38,.58)';
function run(id){const [k,v]=id.split(':');const ph=document.querySelector('.phone[data-k="'+k+'"][data-v="'+v+'"]');
  yhDone.play(k,{phone:ph,name:'하늘조각',photo:'img/them.jpg',veil:v==='dim'?DIM:undefined});}
const ALL=[...document.querySelectorAll('[data-play]')].map(b=>b.dataset.play);
document.querySelectorAll('[data-play]').forEach(b=>b.addEventListener('click',()=>run(b.dataset.play)));
document.getElementById('all').addEventListener('click',()=>ALL.forEach(run));
setTimeout(()=>ALL.forEach(run),700);
</script>
