<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>상대 프로필 위쪽 높이</title>
<link rel="stylesheet" href="tokens.css">
<style>
:root{--pg:#EEF2F4;--pg-surface:#FFFFFF;--pg-line:#DDE3E7;--pg-fg:#273037;--pg-fg2:#505C65;--pg-fg3:#69757E;--pg-accent:#377398}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pg:#161C20;--pg-surface:#222A30;--pg-line:#34404A;--pg-fg:#E3E7EA;--pg-fg2:#CFD5DA;--pg-fg3:#98A2AA;--pg-accent:#92C0DF;color-scheme:dark}}
:root[data-theme="dark"]{--pg:#161C20;--pg-surface:#222A30;--pg-line:#34404A;--pg-fg:#E3E7EA;--pg-fg2:#CFD5DA;--pg-fg3:#98A2AA;--pg-accent:#92C0DF;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--pg);color:var(--pg-fg);font:400 14px/1.6 var(--font-sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.wrap{max-width:1200px;margin:0 auto;padding:36px 16px 64px}
.eyebrow{margin:0;font-size:12px;letter-spacing:2px;color:var(--pg-fg3)}
h1.title{margin:6px 0 0;font:400 30px/1.35 var(--font-serif)}
.intro{max-width:80ch;margin:10px 0 0;color:var(--pg-fg2)}
.opts{display:grid;gap:12px;margin-top:20px;max-width:880px}
.opt{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.opt>span{min-width:120px;font-size:13px;font-weight:600;color:var(--pg-fg2)}
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:12px;background:var(--pg-surface);box-shadow:inset 0 0 0 1px var(--pg-line)}
.seg button{height:36px;padding:0 12px;border:0;border-radius:9px;background:none;font-size:13px;color:var(--pg-fg2)}
.seg button[aria-pressed=true]{background:var(--pg-accent);color:#fff}
.seg button:focus-visible{outline:2px solid var(--pg-accent);outline-offset:2px}
.opt small{flex-basis:100%;margin-left:132px;font-size:12px;color:var(--pg-fg3)}
.sync{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--pg-fg2)}
.pair{display:flex;flex-wrap:wrap;gap:28px 32px;margin-top:28px}
.col{flex:0 1 360px;min-width:0;display:flex;flex-direction:column;gap:10px}
.col h2{margin:0;font:400 18px/1.4 var(--font-serif)}
.col h2 b{display:inline-grid;place-items:center;min-width:26px;height:26px;margin-right:8px;padding:0 8px;border-radius:13px;background:var(--pg-accent);color:#fff;font:600 12px var(--font-sans);vertical-align:2px}
.col>p{margin:0;font-size:13px;color:var(--pg-fg2)}
.tw{overflow-x:auto;margin-top:40px}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:13px}
th,td{padding:10px 12px;border-bottom:1px solid var(--pg-line);text-align:left;vertical-align:top}
th{font-weight:600;color:var(--pg-fg2);white-space:nowrap}
td.same{color:var(--pg-accent);font-weight:600}

/* ───── 휴대폰 (360 × 780, 앱 수치) ───── */
.phone{position:relative;width:360px;max-width:100%;height:780px;border-radius:32px;overflow:hidden;background:var(--color-bg-page);color:var(--color-fg-primary);box-shadow:0 0 0 1px var(--pg-line),0 16px 40px rgb(0 0 0 / .12);display:flex;flex-direction:column}
.ic{display:inline-block;flex:none;width:var(--s,20px);height:var(--s,20px);background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
.top{flex:none;height:52px;margin-top:16px;padding:0 20px;display:flex;align-items:center;justify-content:space-between}
.back{width:44px;height:44px;margin-left:-10px;border:0;background:none;display:grid;place-items:center}
.back .ic{--m:var(--ic-chevron-left-large);--s:24px;transform:translateX(-8px)}
.cnt{font-size:12px;color:var(--color-fg-accent-strong);font-variant-numeric:tabular-nums}
.more{width:44px;height:44px;margin-right:-10px;border:0;background:none;display:grid;place-items:center;font:700 16px/1 var(--font-sans);letter-spacing:1px;color:var(--color-fg-primary)}
.gauge{flex:none;height:3px;margin:0 20px;border-radius:3px;background:var(--color-bg-button-primary)}
.body{flex:1;min-height:0;overflow-y:auto;padding:24px 20px 32px;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.hd{margin:0;font:400 28px/1.45 var(--font-serif);letter-spacing:-.5px}
.lead{margin:12px 0 28px;font-size:13px;line-height:1.7;color:var(--color-fg-tertiary)}
.lead small{display:block;font-size:11px;color:var(--color-fg-subtle)}
/* 공통 소개 본문 */
.photo{position:relative;height:330px;border-radius:90px 90px 18px 18px;overflow:hidden;background:var(--color-bg-notice)}
.photo .track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.photo .track::-webkit-scrollbar{display:none}
.photo img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:center}
.dots{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center;gap:var(--photo-dot-gap,6px)}
.photo .dots::after{content:none!important;display:none!important}
.dots i{width:var(--photo-dot,6px);height:var(--photo-dot,6px);border-radius:3px;background:var(--photo-dot-off,rgb(255 255 255 / .55));box-shadow:var(--photo-dot-shadow,0 0 2px rgb(0 0 0 / .25));transition:width 200ms cubic-bezier(.23,1,.32,1)}
.dots i.on{width:var(--photo-dot-on-w,16px);background:var(--photo-dot-on,#fff)}
.recent{position:absolute;left:12px;bottom:12px;height:28px;padding:0 10px;border-radius:14px;background:color-mix(in srgb,var(--white) 88%,transparent);font:600 12px/28px var(--font-sans);color:var(--sage-700,#3D6B4F);display:flex;align-items:center;gap:6px}
.photo.rc-top .recent{left:50%;top:20px;bottom:auto;transform:translateX(-50%)}
.rc-name{position:static;height:24px;padding:0 8px;border-radius:12px;background:var(--color-bg-sage-soft,#E6F0EA);font:600 11px/24px var(--font-sans);margin-left:2px}
.recent::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--sage-500,#5E9A74)}
.nrow{display:flex;align-items:center;gap:6px;margin-top:var(--fact-photo-gap-top,32px)}
.name{margin:0;font:400 var(--fact-name-size,30px)/1.3 var(--font-serif);letter-spacing:-.5px}
.name em{font-style:normal;font-size:.8em;color:var(--color-fg-secondary)}
.cert{width:22px;height:22px;flex:none}
.cert.b{color:var(--sky-500)}.cert.s{color:var(--sage-600,#4F8566)}
.cert svg{width:100%;height:100%;fill:currentColor}
.job{margin:6px 0 0;font-size:15px;font-weight:600;color:var(--color-fg-primary)}
.meta{display:flex;align-items:center;gap:4px;margin:8px 0 0;font-size:14px;color:var(--color-fg-secondary)}
.meta .pin{width:16px;height:16px;flex:none}
.meta i{width:2px;height:2px;margin:0 4px;border-radius:50%;background:var(--color-fg-subtle)}
.tags{display:flex;flex-wrap:wrap;gap:4px 12px;margin:12px 0 0;padding:0;list-style:none;font-size:var(--fact-tag-size,14px);color:var(--color-fg-accent-strong)}
.key{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;margin-top:32px;padding:20px 0;border-radius:20px;background:var(--color-bg-surface)}
.key>div{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:0 4px;min-width:0}
.key .fi{color:var(--color-fg-accent);margin-bottom:4px}
.key b{font-size:17px;font-weight:600;line-height:1.35;word-break:keep-all}
.key b.long{font-size:15px}
.key small{font-size:11px;color:var(--color-fg-subtle)}
.key svg.v{width:6px;height:auto;align-self:stretch;fill:none;stroke:var(--color-border-default);stroke-width:1.4;stroke-linecap:round}
.fi{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.lf{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 0;padding:0;list-style:none}
.lf li{position:relative;isolation:isolate;display:flex;align-items:center;gap:12px;height:56px;padding:0 16px;color:var(--ink,var(--color-fg-primary))}
.lf li .fi{color:var(--ink)}
.lf span{display:flex;flex-direction:column;line-height:1.35}
.lf small{font-size:11px;opacity:.75}
.lf b{font-size:14px;font-weight:500}
svg.hzs{position:absolute;left:0;top:0;z-index:-1;overflow:visible;pointer-events:none}
.qa{margin-top:var(--fact-qa-gap,48px)}
.qa h3{margin:0 0 8px;font:400 19px/1.7 var(--font-serif);color:var(--color-fg-accent-strong)}
.qa p{margin:0;font-size:14px;line-height:2;color:var(--color-fg-secondary)}
.story{margin:32px 0 0;height:240px;border-radius:18px;overflow:hidden}
.story img{width:100%;height:100%;object-fit:cover;display:block}
.foot{margin:32px 0 0;font-size:11px;color:var(--color-fg-subtle);text-align:center}
.bottom{flex:none;padding:12px 20px 20px;background:var(--color-bg-page);box-shadow:0 -1px 0 var(--color-border-default)}
.cta{width:100%;height:52px;border:0;border-radius:14px;background:var(--color-bg-button-primary);color:var(--white);font-size:15px;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1.15fr;gap:10px}
.demo{margin:10px 0 0;text-align:center;font-size:11px;color:var(--color-fg-muted)}

.grid{display:flex;flex-wrap:wrap;gap:32px 24px;margin-top:28px}
.item{flex:0 1 360px;min-width:0;display:flex;flex-direction:column;gap:10px}
.item h2{margin:0;display:flex;align-items:center;gap:8px;font:400 18px/1.4 var(--font-serif)}
.item h2 b{display:grid;place-items:center;min-width:26px;height:26px;padding:0 6px;border-radius:13px;background:var(--pg-accent);color:#fff;font:600 12px var(--font-sans)}
.item.now h2 b{background:var(--pg-fg3)}
.item>p{margin:0;font-size:13px;color:var(--pg-fg2)}
.item .feel{font-size:12px;color:var(--pg-fg3)}
.item .run{display:flex;gap:8px}
.item .run button{flex:1;height:40px;border:0;border-radius:10px;background:var(--pg-surface);box-shadow:inset 0 0 0 1px var(--pg-line);font-size:12px;cursor:pointer}
/* 위쪽 머리 · 변형별 높이와 배경 */
.phone{position:relative}
.phone .body{position:absolute;left:0;right:0;bottom:var(--bottom-h,84px);top:var(--body-top,100px);padding-top:var(--body-pad,0px)}
.phone .bottom{position:absolute;left:0;right:0;bottom:0}
.phone .top{position:absolute;left:0;right:0;top:0;padding:var(--top-pad,24px) 20px 0;height:calc(var(--top-pad,24px) + 44px)}
.phone .top.is-scrolled{box-shadow:none}
.phone .line{position:absolute;left:0;right:0;top:var(--line-y,100px);height:1px;background:var(--color-border-default);opacity:0;transition:opacity 200ms ease-out;z-index:3;pointer-events:none}
.phone.scrolled .line{opacity:1}
/* A: 낮게 */
.v-a{--top-pad:12px;--body-top:56px;--line-y:56px}
/* B: 낮게 + 내용이 뒤로 지나가며 그라데이션 */
.v-b,.v-c{--top-pad:12px;--body-top:0px;--body-pad:60px}
.v-b .line,.v-c .line{display:none}
.v-b .top::before,.v-c .top::before{content:"";position:absolute;left:0;right:0;top:0;height:88px;z-index:-1;pointer-events:none;opacity:0;transition:opacity 200ms ease-out}
.v-b .top::before{background:linear-gradient(var(--color-bg-page) 0%,var(--color-bg-page) 60%,color-mix(in srgb,var(--color-bg-page) 0%,transparent) 100%)}
.v-c .top::before{background:linear-gradient(color-mix(in srgb,var(--color-bg-page) 80%,transparent) 0%,color-mix(in srgb,var(--color-bg-page) 60%,transparent) 60%,color-mix(in srgb,var(--color-bg-page) 0%,transparent) 100%);-webkit-backdrop-filter:blur(10px) saturate(140%);backdrop-filter:blur(10px) saturate(140%);-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
.phone.scrolled .top::before{opacity:1}
.v-b .top,.v-c .top{background:none}
/* 위쪽 머리 */
.top{position:relative;z-index:3;gap:4px;margin-top:0;padding-top:16px;height:68px;transition:box-shadow 200ms ease-out,background-color 200ms ease-out}
.top.is-scrolled{background:color-mix(in srgb,var(--color-bg-page) 94%,transparent);box-shadow:0 1px 0 var(--color-border-default)}
.eng{position:absolute;left:50%;top:calc(16px + 22px);transform:translate(-50%,-50%);font-size:11px;letter-spacing:.5px;color:var(--color-fg-accent)}
.who{flex:1;min-width:0;display:flex;align-items:center;gap:8px;margin-left:-2px}
.who .av{position:relative;width:28px;height:28px;flex:none;border-radius:50%;background:center 30%/cover;box-shadow:0 0 0 1px var(--color-border-default)}
.who .av.on::after{content:"";position:absolute;right:-1px;bottom:-1px;width:9px;height:9px;border-radius:50%;background:var(--sage-500,#5E9A74);box-shadow:0 0 0 2px var(--color-bg-page)}
.who .tx{min-width:0;display:flex;flex-direction:column;line-height:1.25}
.who strong{font:600 16px/1.3 var(--font-sans);color:var(--color-fg-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{font-size:12px;color:var(--color-fg-tertiary);white-space:nowrap}
.who.reveal{opacity:0;transform:translateY(6px);transition:opacity 200ms cubic-bezier(.23,1,.32,1),transform 200ms cubic-bezier(.23,1,.32,1);pointer-events:none}
.top.show-who .who.reveal{opacity:1;transform:none;pointer-events:auto}
@media (prefers-reduced-motion:reduce){.who.reveal{transform:none}}

</style>

/* ── 공통 소개 본문: 두 화면이 이 함수 하나를 써요 ── */
function profileBody(p){
  const jobInKey=O.job==='key'?p.job:p.jobCat;
  const ageName=O.age==='name'?`<em>, ${p.age}</em>`:'';
  const ageMeta=O.age==='meta'?`${p.age}세<i></i>`:'';
  const LIFE=[['smoke','담배'],['drink','술'],['rel','종교'],['edu','학력']];
  const q=p.qa.map(([h,a],i)=>`<section class="qa"><h3>“${h}”</h3><p>${a}</p></section>${O.story==='on'&&i===0?`<figure class="story"><img src="${p.story}" alt="${p.name}의 일상 사진"></figure>`:''}`).join('');
  const rc=p.recent&&O.recent!=='name'?'<span class="recent">최근활동</span>':'';
  return `<div class="photo${O.recent==='top'?' rc-top':''}"><div class="track">${p.photos.map((s,i)=>`<img src="${s}" alt="${p.name}의 사진 ${i+1}">`).join('')}</div>${rc}<div class="dots" aria-label="프로필 사진 1 / ${p.photos.length}">${p.photos.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</div></div>
  <div class="nrow"><h2 class="name">${p.name}${ageName}</h2>${p.certs}${p.recent&&O.recent==='name'?'<span class="recent rc-name">최근활동</span>':''}</div>
  ${O.job==='line'?`<p class="job">${p.job}</p>`:''}
  <p class="meta">${PIN}${ageMeta}${p.city}<i></i>${p.gender}</p>
  <ul class="tags" aria-label="해시태그">${p.tags.map(t=>`<li>#${t}</li>`).join('')}</ul>
  <div class="key" role="list" aria-label="나에 대해"><div role="listitem">${fi('job')}<b class="${jobInKey.length>4?'long':''}">${jobInKey}</b><small>하는 일</small></div>${VL}<div role="listitem">${fi('h')}<b>${p.h}</b><small>키</small></div>${VL}<div role="listitem">${fi('mbti')}<b>${p.mbti}</b><small>성격</small></div></div>
  <ul class="lf" aria-label="생활" data-hz>${LIFE.map(([k,l],i)=>`<li>${fi(k)}<span><small>${l}</small><b>${p.life[i]}</b></span></li>`).join('')}</ul>
  ${q}`;
}
function wire(ph){const tr=ph.querySelector('.track'),dots=[...ph.querySelectorAll('.dots i')],box=ph.querySelector('.dots');
  tr.addEventListener('scroll',()=>{const k=Math.round(tr.scrollLeft/tr.clientWidth);dots.forEach((d,i)=>d.classList.toggle('on',i===k));box.setAttribute('aria-label',`프로필 사진 ${k+1} / ${dots.length}`);},{passive:true});}
const V0=[
 {k:'now',tag:'지금',name:'GET TO KNOW YOU',desc:'가운데 영문 문구만 있어요. 내려가면 지금 누구 프로필인지 위에서 알 수 없어요.',feel:'장식 · 정보 없음'},
 {k:'a',tag:'A',name:'처음부터 사진 + 이름',desc:'뒤로가기 바로 옆에 작은 사진(28)과 이름(16)을 늘 둬요. 맨 위에서는 본문 큰 이름과 함께 보이지만, 크기 차이가 커서 겹쳐 보이지 않아요. 내리면 머리에 옅은 바탕과 아래 선이 생겨요.',feel:'단순 · 늘 같음'},
 {k:'b',tag:'B',name:'내리면 나타나는 사진 + 이름',desc:'맨 위에서는 머리를 비워 두고(뒤로 · 더보기만), 본문 이름이 머리 밑으로 사라지는 순간 작은 사진과 이름이 살짝 떠오르며 나타나요. 이름이 두 번 보이지 않아요.',feel:'깔끔 · iOS 큰 제목 같은 결'},
 {k:'c',tag:'C',name:'사진 + 이름 + 한 줄 정보',desc:'A처럼 늘 보이고, 이름 아래에 "26세 · 서울 마포구"를 작게 둬요. 최근 활동이면 작은 사진에 초록 점이 붙어요. 이야기를 읽으면서도 나이와 동네가 같이 보여요.',feel:'정보 많음 · 편지함 머리와 같은 결'},
];
const V=[
 {k:'now',tag:'지금',name:'머리 100px · 내용은 선 아래',desc:'머리가 위에서 24~68px에 있고, 내용은 100px부터 시작해요. 가입 화면처럼 진행 막대 자리가 있지만 상대 프로필엔 막대가 없어서 32px이 비어 있어요. 내리면 100px에 선이 생기고 내용은 그 아래로만 보여요.',feel:'답답함 · 빈 자리'},
 {k:'a',tag:'A',name:'낮은 머리 56px',desc:'머리를 위 12px · 높이 44로 붙이고, 내용을 56px부터 시작해요. 사진이 44px 위로 올라와 첫 화면에 더 많이 보여요. 내리면 56px에 선이 생겨요.',feel:'단정 · 공간 확보'},
 {k:'b',tag:'B',name:'낮은 머리 + 그라데이션 배경',desc:'A처럼 낮추고, 내용이 머리 뒤로 지나가게 해요. 내리기 시작하면 머리 뒤에 화면 바탕색이 위에서 아래로 옅어지는 그라데이션(88px)이 깔려, 선 없이도 글자가 겹쳐 보이지 않아요.',feel:'열림 · 추천'},
 {k:'c',tag:'C',name:'B + 살짝 흐림',desc:'B의 그라데이션에 아래로 갈수록 사라지는 흐림(10px)을 더해요. 하단 메뉴의 유리와 같은 결이라 위아래가 짝이 맞아요. 대신 사진이 지나갈 때 흐림이 조금 눈에 띄어요.',feel:'유리 · 하단 메뉴와 같은 결'},
];
function head(v,p){
  const av=`<span class="av${v.k==='c'&&p.recent?' on':''}" style="background-image:url(${p.photos[0]})" aria-hidden="true"></span>`;
  const meta=p.age+'세 · '+p.city;
  const who=`<div class="who reveal">${av}<span class="tx"><strong>${p.name}</strong></span></div>`;
  return `<div class="top"><button type="button" class="back" aria-label="오늘의 인연으로 돌아가기"><i class="ic" aria-hidden="true"></i></button>${who}<button type="button" class="more" aria-label="프로필 더보기">···</button></div>`;
}
const grid=document.getElementById('grid');
V.forEach(v=>{
  const it=document.createElement('article');it.className='item'+(v.k==='now'?' now':'');
  it.innerHTML=`<h2><b>${v.tag}</b>${v.name}</h2><div class="phone v-${v.k}">${head(v,P.her)}<i class="line" aria-hidden="true"></i><div class="body">${profileBody(P.her)}<p class="foot">가상의 소개 정보와 AI로 만든 시연용 사진입니다.</p></div><div class="bottom"><div class="two"><button type="button" class="cta">나도 관심 있어요</button><button type="button" class="cta">편지 확인하기</button></div></div></div><div class="run"><button type="button" data-y="0">맨 위</button><button type="button" data-y="380">조금 내려서</button><button type="button" data-y="900">이야기까지</button></div><p>${v.desc}</p><span class="feel">느낌 · ${v.feel}</span>`;
  grid.append(it);
  const ph=it.querySelector('.phone'),body=ph.querySelector('.body'),top=ph.querySelector('.top'),row=ph.querySelector('.nrow');
  wire(ph);
  const sync=()=>{ph.classList.toggle('scrolled',body.scrollTop>2);top.classList.toggle('show-who',row.getBoundingClientRect().bottom<top.getBoundingClientRect().bottom+4);};
  body.addEventListener('scroll',sync,{passive:true});sync();
  it.querySelectorAll('[data-y]').forEach(b=>b.addEventListener('click',()=>body.scrollTo({top:+b.dataset.y,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})));
});
/* 색연필 칸 (앱 H9과 같은 그리기) */
const NS='http://www.w3.org/2000/svg';
const TONE={sky:['#92C0DF','#245D7E'],rose:['#DDAFB7','#7D3749'],gold:['#D1BF9A','#6C582C'],sage:['#9FC4B7','#3C6555']},ORDER=['sky','rose','gold','sage'];
const HZ={angle:58,gap:3.6,w:1.8,op:[.35,.75],trim:5,jit:1.2,pad:0,rad:16},SOFT=.68;
function rng(seed){let s=(seed*2654435761)>>>0||1;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
function lines(x0,y0,x1,y1,a,gap,r){const rad=a*Math.PI/180,dx=Math.cos(rad),dy=-Math.sin(rad),nx=-dy,ny=dx;const ts=[[x0,y0],[x1,y0],[x0,y1],[x1,y1]].map(([x,y])=>x*nx+y*ny);const out=[];
  for(let t=Math.min(...ts)+gap*r();t<Math.max(...ts);t+=gap*(.7+.6*r())){let s0=-1e9,s1=1e9,ok=true;for(const [p,q,lo,hi] of [[nx*t,dx,x0,x1],[ny*t,dy,y0,y1]]){if(Math.abs(q)<1e-9){if(p<lo||p>hi)ok=false;continue;}let a1=(lo-p)/q,a2=(hi-p)/q;if(a1>a2)[a1,a2]=[a2,a1];s0=Math.max(s0,a1);s1=Math.min(s1,a2);}if(ok&&s1-s0>2)out.push([nx*t+dx*s0,ny*t+dy*s0,nx*t+dx*s1,ny*t+dy*s1]);}return out;}
function draw(){document.querySelectorAll('[data-hz]').forEach(list=>{list.querySelectorAll(':scope>li').forEach((el,i)=>{el.querySelector('svg.hzs')?.remove();const w=el.offsetWidth,h=el.offsetHeight,r=rng(i+1),tone=TONE[ORDER[i%4]];el.style.setProperty('--ink',tone[1]);
  const s=document.createElementNS(NS,'svg');s.setAttribute('class','hzs');s.setAttribute('width',w);s.setAttribute('height',h);s.setAttribute('aria-hidden','true');const cid='c'+Math.random().toString(36).slice(2,8);
  const c=document.createElementNS(NS,'clipPath');c.id=cid;const q=document.createElementNS(NS,'rect');q.setAttribute('width',w);q.setAttribute('height',h);q.setAttribute('rx',HZ.rad);c.append(q);s.append(c);
  const g=document.createElementNS(NS,'g');g.setAttribute('filter','url(#pencil)');g.setAttribute('clip-path',`url(#${cid})`);s.append(g);
  lines(0,0,w,h,HZ.angle,HZ.gap,r).forEach(([ax,ay,bx,by])=>{const L=Math.hypot(bx-ax,by-ay),ux=(bx-ax)/L,uy=(by-ay)/L,t0=r()*HZ.trim,t1=r()*HZ.trim;const sx=ax+ux*t0+(r()-.5)*HZ.jit,sy=ay+uy*t0+(r()-.5)*HZ.jit,ex=bx-ux*t1+(r()-.5)*HZ.jit,ey=by-uy*t1+(r()-.5)*HZ.jit,mx=(sx+ex)/2+(r()-.5)*1.6,my=(sy+ey)/2+(r()-.5)*1.6;
    const p=document.createElementNS(NS,'path');p.setAttribute('d',`M${sx.toFixed(1)} ${sy.toFixed(1)}Q${mx.toFixed(1)} ${my.toFixed(1)} ${ex.toFixed(1)} ${ey.toFixed(1)}`);p.setAttribute('stroke',tone[0]);p.setAttribute('stroke-width',(HZ.w*(.8+.4*r())).toFixed(2));p.setAttribute('stroke-opacity',((HZ.op[0]+(HZ.op[1]-HZ.op[0])*r())*SOFT).toFixed(2));p.setAttribute('fill','none');p.setAttribute('stroke-linecap','round');g.append(p);});
  el.prepend(s);});});}
(document.fonts?.ready||Promise.resolve()).then(()=>requestAnimationFrame(draw));
</script>
