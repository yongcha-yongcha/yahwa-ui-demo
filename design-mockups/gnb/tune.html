<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>하단 메뉴 세부 조정</title>
<link rel="stylesheet" href="tokens.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--color-bg-page);color:var(--color-fg-primary);font:400 15px/1.6 var(--font-sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.wrap{max-width:900px;margin:0 auto;padding:32px 24px 64px}
h1{margin:0;font:var(--type-heading-2)}
.lead{margin:2px 0 20px;color:var(--color-fg-tertiary);font:var(--type-body-3-normal)}
.layout{display:grid;grid-template-columns:360px minmax(0,1fr);gap:32px;align-items:start}
.left{position:sticky;top:16px}
.seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--color-bg-muted);margin-bottom:12px}
.seg button{flex:1;height:32px;border-radius:8px;font:var(--type-label-3);color:var(--color-fg-tertiary)}
.seg button[aria-pressed=true]{background:var(--color-bg-surface);color:var(--color-fg-primary)}
.phone{position:relative;width:360px;max-width:100%;height:560px;border-radius:28px;overflow:hidden;background:var(--color-bg-page);border:1px solid var(--color-border-default)}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.list{position:absolute;inset:0;padding:24px var(--layout-gutter);display:grid;gap:12px;align-content:start;overflow:hidden}
.list h3{margin:0 0 4px;font:var(--type-title-1);letter-spacing:var(--tracking-title)}
.row{padding:16px;border-radius:16px;background:var(--color-bg-surface);border:1px solid var(--color-border-default);font:var(--type-body-3-normal);color:var(--color-fg-tertiary)}
.row b{display:block;color:var(--color-fg-primary);font:var(--type-label-1)}
/* 메뉴 */
.gnb{position:absolute;left:var(--mx);right:var(--mx);bottom:var(--mb);height:var(--h);display:flex;align-items:center;padding:0 var(--pi);border-radius:var(--r);background:color-mix(in srgb,var(--glass) calc(var(--alpha)*1%),transparent);border:1px solid color-mix(in srgb,var(--white) calc(var(--edge)*1%),transparent);box-shadow:0 var(--sy) var(--sb) color-mix(in srgb,var(--cool-neutral-800) calc(var(--sa)*1%),transparent);-webkit-backdrop-filter:blur(var(--blur)) saturate(calc(var(--sat)*1%));backdrop-filter:blur(var(--blur)) saturate(calc(var(--sat)*1%))}
.cap{position:absolute;left:0;top:50%;height:var(--ch);margin-top:calc(var(--ch)/-2);border-radius:var(--cr);background:color-mix(in srgb,var(--capc) calc(var(--ca)*1%),transparent);box-shadow:var(--capsh,none);transition:transform 260ms cubic-bezier(.32,.72,0,1),width 260ms cubic-bezier(.32,.72,0,1)}
.cap.glass{--capsh:0 1px 2px color-mix(in srgb,var(--cool-neutral-900) 8%,transparent),0 4px 12px color-mix(in srgb,var(--cool-neutral-900) 10%,transparent)}
.gnb button{position:relative;z-index:1;flex:1;min-width:0;height:var(--ch);display:grid;place-items:center;color:var(--off);transition:transform 100ms ease-out}
.gnb button:active{transform:scale(.94)}
.gnb button:focus-visible{outline:2px solid var(--color-border-accent);outline-offset:-2px;border-radius:var(--cr)}
.sym{position:relative;display:grid;place-items:center;width:var(--ic);height:var(--ic)}
.sym svg{grid-area:1/1;width:var(--ic);height:var(--ic);fill:none;stroke:currentColor;stroke-width:var(--sw);stroke-linecap:round;stroke-linejoin:round;transition:opacity 140ms ease-out}
.sym svg *{vector-effect:non-scaling-stroke}
.sym .fill{opacity:0;color:var(--on);fill:currentColor;stroke:none}
.sym .fill .knock{fill:none;stroke:color-mix(in srgb,var(--capc) 72%,var(--paper));stroke-width:var(--sw)}
.gnb button[aria-current=page] .line{opacity:0}
.gnb button[aria-current=page] .fill{opacity:1}
.dot{position:absolute;left:50%;top:-1px;margin-left:8px;width:var(--bs);height:var(--bs);border-radius:50%;background:var(--red-500);box-shadow:0 0 0 1px var(--white)}
.av{width:32px;height:32px;border-radius:50%;padding:2px;box-shadow:0 0 0 1.5px var(--white)}
button[aria-current=page] .av{box-shadow:0 0 0 2px var(--sky-400)}
.av img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:center 35%}
.check{margin-top:12px;padding:12px 16px;border-radius:12px;background:var(--color-bg-subtle);font:var(--type-body-3-normal);color:var(--color-fg-secondary)}
.check b{font-weight:600}.check .bad{color:var(--color-fg-danger);font-weight:600}
.check .fit{display:block;margin-top:6px}
.presets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.btn{height:36px;padding:0 12px;border-radius:12px;border:1px solid var(--color-border-strong);background:var(--color-bg-surface);font:var(--type-label-3)}
.btn.pri{background:var(--color-bg-button-primary);border-color:var(--color-bg-button-primary);color:var(--color-fg-inverse)}
.btn:focus-visible,.chip:focus-visible,.seg button:focus-visible{outline:2px solid var(--color-border-accent);outline-offset:2px}
.grp{padding:16px 0;border-top:1px solid var(--color-border-default)}
.grp h2{margin:0 0 8px;font:var(--type-label-1)}
.grp.hot h2::after{content:"이번에 볼 곳";margin-left:8px;padding:2px 8px;border-radius:10px;background:var(--color-bg-notice);font:var(--type-caption-1);color:var(--color-fg-accent-strong)}
.ctl{display:grid;grid-template-columns:112px minmax(0,1fr) 56px;gap:8px;align-items:center;min-height:32px;font:var(--type-body-3-normal)}
.ctl output{text-align:right;color:var(--color-fg-tertiary);font-size:12px;font-variant-numeric:tabular-nums}
.ctl input{width:100%;accent-color:var(--sky-600)}
.chips{grid-column:2/4;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:4px;height:28px;padding:0 8px 0 4px;border-radius:14px;border:1px solid var(--color-border-default);background:var(--color-bg-surface);font:var(--type-caption-1)}
.chip i{width:20px;height:20px;border-radius:50%;border:1px solid var(--color-border-default)}
.chip[aria-pressed=true]{border-color:var(--color-border-accent);box-shadow:0 0 0 1px var(--color-border-accent)}
.toggle{grid-column:2/4;display:flex;align-items:center;gap:8px}
.spec{margin:16px 0 0;padding:12px;border-radius:12px;background:var(--color-bg-surface);border:1px solid var(--color-border-default);font:12px/1.6 ui-monospace,Menlo,monospace;color:var(--color-fg-secondary);white-space:pre-wrap;user-select:all}
@media(prefers-reduced-motion:reduce){.cap{transition:none}.gnb button:active{transform:none}}
@media(max-width:800px){.layout{grid-template-columns:minmax(0,360px)}.left{position:static}.wrap{padding:24px 16px 48px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>하단 메뉴 세부 조정</h1>
  <p class="lead">처음 값은 지금 앱 그대로예요. 슬라이더를 움직이면 바로 반영되고, 메뉴 아이콘을 누르면 칩이 옮겨 가요. 마음에 들면 아래 값을 복사해서 보내 주세요.</p>
  <div class="layout">
    <div class="left">
      <div class="seg" role="group" aria-label="배경"><button type="button" data-bg="bright" aria-pressed="true">밝은 사진</button><button type="button" data-bg="dark" aria-pressed="false">어두운 사진</button><button type="button" data-bg="light" aria-pressed="false">밝은 화면</button></div>
      <div class="phone" id="phone"><div id="stage"></div><nav class="gnb" id="gnb" aria-label="앱 메뉴"><span class="cap" id="cap" aria-hidden="true"></span></nav></div>
      <div class="check" id="check" role="status"></div>
    </div>
    <div>
      <div class="presets"><button type="button" class="btn" data-p="now">지금 앱</button><button type="button" class="btn" data-p="A">A 꽉 채운 칩</button><button type="button" class="btn" data-p="B">B 꽉 채운 흰 유리 칩</button><button type="button" class="btn pri" id="copy">값 복사</button></div>
      <div id="panel"></div>
      <pre class="spec" id="spec" aria-label="지금 값"></pre>
    </div>
  </div>
</div>
<script>
const CH={glass:[['Paper','paper'],['흰색','white'],['Sky 50','sky-50'],['Sky 100','sky-100'],['Logo 50','logo-blue-50']],capc:[['Sky 100','sky-100'],['Sky 200','sky-200'],['흰색','white'],['Logo 100','logo-blue-100']],on:[['Sky 600','sky-600'],['Sky 500','sky-500'],['Sky 700','sky-700'],['Logo 600','logo-blue-600'],['CN 800','cool-neutral-800']],off:[['CN 800','cool-neutral-800'],['CN 700','cool-neutral-700'],['CN 600','cool-neutral-600'],['CN 500','cool-neutral-500']]};
const G=[
 ['선택 칩',[['ch','높이',32,64,2,'px'],['cw','가로 (칸 대비)',-16,16,2,'px'],['pi','메뉴 안쪽 좌우',0,16,2,'px'],['cr','모서리',0,32,1,'px'],['!fit','모서리를 메뉴에 맞추기'],['ca','불투명도',0,100,4,'%'],['#capc','색'],['!glassCap','흰 유리 그림자']],true],
 ['유리',[['alpha','불투명도',20,95,2,'%'],['blur','블러',0,40,2,'px'],['sat','채도',100,220,10,'%'],['edge','테두리',0,100,4,'%'],['#glass','유리 색']]],
 ['형태',[['mx','좌우 여백',0,40,4,'px'],['mb','아래 여백',0,40,4,'px'],['h','높이',56,88,4,'px'],['r','모서리',0,44,4,'px']]],
 ['그림자',[['sa','세기',0,48,2,'%'],['sb','퍼짐',0,48,4,'px'],['sy','아래로',0,24,2,'px']]],
 ['아이콘',[['ic','크기',20,28,2,'px'],['sw','선 굵기',1.2,2.2,.1,''],['#on','선택 색'],['#off','비선택 색'],['bs','알림 점',6,12,1,'px']]]];
/* 지금 앱 값 = tokens.css --gnb-* */
const NOW={alpha:60,blur:6,sat:170,edge:20,glass:'paper',mx:20,mb:20,h:64,r:32,sa:14,sb:24,sy:8,ca:72,ch:48,cw:0,pi:8,cr:24,fit:false,capc:'sky-100',glassCap:false,ic:24,sw:1.5,on:'sky-600',off:'cool-neutral-800',bs:8};
const P={now:{...NOW},A:{...NOW,ch:54,pi:4,cr:27,fit:true},B:{...NOW,ch:54,pi:4,cr:27,fit:true,capc:'white',ca:92,glassCap:true}};
const KEY='yahwa-gnb-tune-v2';let S;try{S={...NOW,...(JSON.parse(localStorage.getItem(KEY))||{})}}catch(_){S={...NOW}}
const hexOf=n=>getComputedStyle(document.documentElement).getPropertyValue('--'+n).trim().slice(1);
const rgb=h=>[0,2,4].map(i=>parseInt(h.substr(i,2),16));const lin=c=>{c/=255;return c<=.04045?c/12.92:((c+.055)/1.055)**2.4};const Y=c=>.2126*lin(c[0])+.7152*lin(c[1])+.0722*lin(c[2]);const cr=(a,b)=>{const [x,y]=[Y(a),Y(b)].sort((p,q)=>q-p);return (x+.05)/(y+.05)};const mix=(t,a,b)=>t.map((v,i)=>v*a+b[i]*(1-a));
const ICONS=[
 ['인연 홈',false,24,'<rect x="3" y="3" width="7" height="8" rx="2"/><rect x="14" y="3" width="7" height="8" rx="2"/><rect x="3" y="15" width="7" height="6" rx="2"/><rect x="14" y="15" width="7" height="6" rx="2"/>','<rect x="2.25" y="2.25" width="8.5" height="9.5" rx="2.5"/><rect x="13.25" y="2.25" width="8.5" height="9.5" rx="2.5"/><rect x="2.25" y="14.25" width="8.5" height="7.5" rx="2.5"/><rect x="13.25" y="14.25" width="8.5" height="7.5" rx="2.5"/>'],
 ['마음함',true,32,'<path d="M16 26C12 23 4.5 17.5 5 11.3C5.4 5.5 12.2 5.5 15.6 12.2C18.1 5.2 25.8 4.9 27 10.8C28.1 16.1 21.6 23.1 16 26Z"/>','<path d="M16 27C12 24 3.6 18 4 11.2C4.4 4.5 12.1 4.3 15.6 10.2C18.3 3.9 26.8 3.8 28 10.6C29.1 16.5 22 24 16 27Z"/>'],
 ['편지함',true,24,'<path d="M3 6Q12 5 21 6V19H3Z M3 7L12 14L21 7 M3 19L9 13 M21 19L15 13"/>','<path d="M2.25 5.4Q12 4.2 21.75 5.4V19.75H2.25Z"/><path class="knock" d="M3 7L12 14L21 7 M3 19L9 13 M21 19L15 13"/>'],
 ['커뮤니티',true,24,'<path d="M4 5h16v12H9l-5 4V5M8 9h8M8 13h5"/>','<path d="M3.25 4.25h17.5v13.5H9.3l-6.05 4.8Z"/><path class="knock" d="M8 9h8M8 13h5"/>']];
const nav=document.getElementById('gnb'),cap=document.getElementById('cap');
nav.insertAdjacentHTML('beforeend',ICONS.map(([l,b,vb,line,fill],i)=>`<button type="button" aria-label="${l}"${i===0?' aria-current="page"':''}><span class="sym"><svg class="line" viewBox="0 0 ${vb} ${vb}" aria-hidden="true">${line}</svg><svg class="fill" viewBox="0 0 ${vb} ${vb}" aria-hidden="true">${fill}</svg>${b?'<span class="dot" aria-hidden="true"></span>':''}</span></button>`).join('')+'<button type="button" aria-label="마이페이지"><span class="av"><img src="img/dark.jpg" alt=""></span></button>');
const place=()=>{const a=nav.querySelector('[aria-current]');cap.style.width=(a.offsetWidth+S.cw)+'px';cap.style.transform=`translateX(${a.offsetLeft-S.cw/2}px)`;};
nav.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;nav.querySelectorAll('button').forEach(x=>x.removeAttribute('aria-current'));b.setAttribute('aria-current','page');place();});
const panel=document.getElementById('panel');
panel.innerHTML=G.map(([t,c,hot])=>`<section class="grp${hot?' hot':''}"><h2>${t}</h2>${c.map(x=>{const k=x[0];if(k[0]==='#'){const n=k.slice(1);return `<div class="ctl"><span>${x[1]}</span><div class="chips">${CH[n].map(([l,v])=>`<button type="button" class="chip" data-chip="${n}" data-v="${v}"><i style="background:var(--${v})"></i>${l}</button>`).join('')}</div></div>`}if(k[0]==='!'){const n=k.slice(1);return `<div class="ctl"><span>${x[1]}</span><label class="toggle"><input type="checkbox" data-t="${n}" style="width:auto"></label></div>`}return `<label class="ctl"><span>${x[1]}</span><input type="range" data-k="${k}" min="${x[2]}" max="${x[3]}" step="${x[4]}"><output data-o="${k}" data-u="${x[5]}"></output></label>`}).join('')}</section>`).join('');
function render(){
 S.ch=Math.min(S.ch,S.h-2);
 /* 메뉴 모서리에 맞춘 칩 모서리 = 메뉴 모서리 − 위아래 남는 틈 */
 const gap=(S.h-2-S.ch)/2;if(S.fit)S.cr=Math.max(0,Math.round(Math.min(S.r-gap,S.ch/2)));
 const s=nav.style;for(const k of ['alpha','sat','edge','sa','ca'])s.setProperty('--'+k,S[k]);for(const k of ['blur','mx','mb','h','r','sb','sy','ch','cr','ic','bs','pi'])s.setProperty('--'+k,S[k]+'px');s.setProperty('--sw',S.sw);for(const k of ['glass','capc','on','off'])s.setProperty('--'+k,`var(--${S[k]})`);
 cap.classList.toggle('glass',!!S.glassCap);
 panel.querySelectorAll('[data-k]').forEach(i=>{i.value=S[i.dataset.k];if(i.dataset.k==='cr')i.disabled=!!S.fit;});panel.querySelectorAll('[data-o]').forEach(o=>{o.textContent=S[o.dataset.o]+o.dataset.u});panel.querySelectorAll('[data-chip]').forEach(c=>c.setAttribute('aria-pressed',S[c.dataset.chip]===c.dataset.v));panel.querySelectorAll('[data-t]').forEach(i=>{i.checked=!!S[i.dataset.t]});
 const K=[0,0,0],g=mix(rgb(hexOf(S.glass)),S.alpha/100,K),cp=mix(rgb(hexOf(S.capc)),S.ca/100,g),a=cr(rgb(hexOf(S.off)),g),b=cr(rgb(hexOf(S.on)),cp),f=v=>v<3?`<span class="bad">${v.toFixed(2)} 부족</span>`:v.toFixed(2);
 const slot=Math.round(nav.querySelector('button').offsetWidth+S.cw),ideal=Math.max(0,Math.round(Math.min(S.r-gap,S.ch/2)));
 document.getElementById('check').innerHTML=`<b>검은 배경 기준 아이콘 대비</b> (3 이상 권장)<br>비선택 ${f(a)} · 선택 ${f(b)}<span class="fit"><b>칩</b> ${S.ch} × ${slot} · 위아래 틈 ${gap}px · 메뉴에 맞는 모서리 ${ideal}px${S.cr===ideal?' (맞음)':''}</span>`;
 document.getElementById('spec').textContent=`[하단 메뉴] 칩 높이 ${S.ch}px · 가로 칸${S.cw>=0?'+':''}${S.cw}px · 메뉴 안쪽 좌우 ${S.pi}px · 칩 모서리 ${S.cr}px · 칩 색 ${S.capc} ${S.ca}%${S.glassCap?' · 흰 유리 그림자':''}\n유리 ${S.glass} ${S.alpha}% · 블러 ${S.blur}px · 채도 ${S.sat}% · 테두리 ${S.edge}%\n형태 좌우 ${S.mx}px · 아래 ${S.mb}px · 높이 ${S.h}px · 모서리 ${S.r}px · 그림자 ${S.sa}% / ${S.sb}px / ${S.sy}px\n아이콘 ${S.ic}px · 선 ${S.sw} · 선택 ${S.on} · 비선택 ${S.off} · 알림 점 ${S.bs}px`;
 try{localStorage.setItem(KEY,JSON.stringify(S))}catch(_){}
 place();
}
panel.addEventListener('input',e=>{const t=e.target;if(t.dataset.k){S[t.dataset.k]=+t.value;render()}else if(t.dataset.t){S[t.dataset.t]=t.checked;render()}});
panel.addEventListener('click',e=>{const c=e.target.closest('[data-chip]');if(c){S[c.dataset.chip]=c.dataset.v;render()}});
document.querySelector('.presets').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.p){S={...P[b.dataset.p]};render()}else{const txt=document.getElementById('spec').textContent;try{await navigator.clipboard.writeText(txt);const o=b.textContent;b.textContent='복사됨';setTimeout(()=>b.textContent=o,1100)}catch(_){b.textContent='아래 값을 직접 복사해 주세요'}}});
const LIGHT='<div class="list"><h3>오늘의 인연</h3>'+[['마음함','새로 도착한 마음이 있어요.'],['편지함','첫 편지에서 이어지는 우리 이야기'],['커뮤니티','주말에 다녀온 카페를 나눠보세요.'],['약속','이번 주 토요일 오후 3시'],['리프','90 리프를 가지고 있어요.'],['알림','확인하지 않은 소식이 3개 있어요.']].map(r=>`<div class="row"><b>${r[0]}</b>${r[1]}</div>`).join('')+'</div>';
const seg=document.querySelector('.seg');const setBg=v=>{seg.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.bg===v));document.getElementById('stage').innerHTML=v==='light'?LIGHT:`<img class="bg" alt="" src="img/${v}.jpg">`};
seg.addEventListener('click',e=>{const b=e.target.closest('button');if(b)setBg(b.dataset.bg)});
setBg('bright');render();addEventListener('resize',place);
</script>
</body>
</html>
