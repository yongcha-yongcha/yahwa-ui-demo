<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>하단 메뉴 선택 칩</title>
<link rel="stylesheet" href="tokens.css">
<style>
:root{--pg:#EEF2F4;--pg-surface:#FFFFFF;--pg-line:#DDE3E7;--pg-fg:#273037;--pg-fg2:#505C65;--pg-fg3:#69757E;--pg-accent:#377398}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pg:#161C20;--pg-surface:#222A30;--pg-line:#34404A;--pg-fg:#E3E7EA;--pg-fg2:#CFD5DA;--pg-fg3:#98A2AA;--pg-accent:#92C0DF;color-scheme:dark}}
:root[data-theme="dark"]{--pg:#161C20;--pg-surface:#222A30;--pg-line:#34404A;--pg-fg:#E3E7EA;--pg-fg2:#CFD5DA;--pg-fg3:#98A2AA;--pg-accent:#92C0DF;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--pg);color:var(--pg-fg);font:400 14px/1.6 var(--font-sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:1600px;margin:0 auto;padding:36px 16px 64px}
.eyebrow{margin:0;font-size:12px;letter-spacing:2px;color:var(--pg-fg3)}
h1.title{margin:6px 0 0;font:400 30px/1.35 var(--font-serif)}
.intro{max-width:78ch;margin:10px 0 0;color:var(--pg-fg2)}
.grid{display:flex;flex-wrap:wrap;gap:32px 24px;margin-top:28px}
.item{flex:0 1 360px;min-width:0;display:flex;flex-direction:column;gap:10px}
.item h2{margin:0;display:flex;align-items:center;gap:8px;font:400 18px/1.4 var(--font-serif)}
.item h2 b{display:grid;place-items:center;min-width:26px;height:26px;padding:0 6px;border-radius:13px;background:var(--pg-accent);color:#fff;font:600 12px var(--font-sans)}
.item.now h2 b{background:var(--pg-fg3)}
.item>p{margin:0;font-size:13px;color:var(--pg-fg2)}
.item .spec{font-size:12px;color:var(--pg-fg3);font-variant-numeric:tabular-nums}
.zoom{display:flex;gap:8px;align-items:center;margin-top:16px;font-size:13px;color:var(--pg-fg2)}
.zoom button{height:36px;padding:0 14px;border:0;border-radius:10px;background:var(--pg-surface);box-shadow:inset 0 0 0 1px var(--pg-line);cursor:pointer}
.zoom button[aria-pressed=true]{background:var(--pg-accent);color:#fff;box-shadow:none}

/* ───── 휴대폰 아래쪽 (360 폭, 앱 수치) ───── */
.phone{position:relative;width:360px;max-width:100%;height:240px;border-radius:0 0 32px 32px;overflow:hidden;background:var(--color-bg-page);box-shadow:0 0 0 1px var(--pg-line);transform-origin:top left}
.zoomed .phone{zoom:1.6}
.card{position:absolute;left:20px;right:20px;top:-420px;height:494px;border-radius:32px;background:url(img/card.jpg) 50% 30%/cover}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(transparent 60%,rgb(136 112 56 / .9))}
.pager{position:absolute;left:0;right:0;top:96px;display:flex;justify-content:center;align-items:center;gap:56px;font:400 22px/1 var(--font-sans);color:var(--color-fg-secondary);font-variant-numeric:tabular-nums}
.pager i{width:20px;height:20px;background:currentColor;-webkit-mask:var(--ic-chevron-left) center/contain no-repeat;mask:var(--ic-chevron-left) center/contain no-repeat}
.pager i+span+i{-webkit-mask-image:var(--ic-chevron-right);mask-image:var(--ic-chevron-right)}

/* GNB 공통 (앱 --gnb-*) */
.nav{--inset:8px;--cap-h:48px;--cap-r:24px;position:absolute;left:20px;right:20px;bottom:20px;height:64px;display:flex;align-items:center;padding:0 var(--inset);border:1px solid var(--gnb-border);border-radius:32px;background:var(--gnb-bg);-webkit-backdrop-filter:blur(var(--gnb-blur)) saturate(var(--gnb-saturate));backdrop-filter:blur(var(--gnb-blur)) saturate(var(--gnb-saturate));box-shadow:var(--gnb-shadow)}
.nav button{position:relative;z-index:1;flex:1 1 0;min-width:0;height:var(--cap-h);padding:0;border:0;background:none;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--gnb-icon);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform 100ms ease-out,flex-grow var(--gnb-capsule-duration) var(--gnb-capsule-ease)}
.nav button:active{transform:scale(.94)}
.nav button:focus-visible{outline:2px solid var(--color-border-accent);outline-offset:-2px;border-radius:var(--cap-r)}
.sym{position:relative;display:grid;place-items:center;width:24px;height:24px;flex:none}
.sym svg{grid-area:1/1;width:24px;height:24px;stroke:currentColor;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:opacity 140ms ease-out}
.sym svg *{vector-effect:non-scaling-stroke}
.sym .fill{opacity:0;color:var(--gnb-icon-active);fill:currentColor;stroke:none}
.sym .fill .knock{fill:none;stroke:var(--gnb-icon-knock);stroke-width:1.5}
.nav button[aria-current=page] .line{opacity:0}
.nav button[aria-current=page] .fill{opacity:1}
.badge{position:absolute;left:50%;top:-1px;margin-left:8px;width:8px;height:8px;border-radius:50%;background:var(--gnb-badge-bg);box-shadow:0 0 0 1px var(--white)}
.ava{width:32px;height:32px;border-radius:50%;padding:2px;box-shadow:0 0 0 1.5px var(--white);flex:none}
.ava img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover}
.nav button[aria-current=page] .ava{box-shadow:0 0 0 2px var(--color-brand-line,var(--sky-500))}
.lbl{font:600 13px/1 var(--font-sans);white-space:nowrap;color:var(--gnb-icon-active);max-width:0;opacity:0;overflow:hidden;transition:max-width var(--gnb-capsule-duration) var(--gnb-capsule-ease),opacity 160ms ease-out}
.cap{position:absolute;z-index:0;left:0;top:50%;height:var(--cap-h);margin-top:calc(var(--cap-h)/-2);border-radius:var(--cap-r);background:var(--gnb-selected-bg);transition:transform var(--gnb-capsule-duration) var(--gnb-capsule-ease),width var(--gnb-capsule-duration) var(--gnb-capsule-ease);will-change:transform}
.cap.no-anim{transition:none}

/* A 꽉 채움: 4px 안쪽, 모서리는 바깥 32에서 4를 뺀 28 */
.v-a .nav{--inset:4px;--cap-h:54px;--cap-r:27px}
/* B 꽉 채움 + 흰 유리 칩 */
.v-b .nav{--inset:4px;--cap-h:54px;--cap-r:27px}
.v-b .cap{background:color-mix(in srgb,var(--white) 92%,transparent);box-shadow:0 1px 2px color-mix(in srgb,var(--cool-neutral-900) 8%,transparent),0 4px 12px color-mix(in srgb,var(--cool-neutral-900) 10%,transparent),inset 0 0 0 1px color-mix(in srgb,var(--white) 60%,transparent)}
/* C 꽉 채움 + 선택한 칸만 이름이 함께 */
.v-c .nav{--inset:4px;--cap-h:54px;--cap-r:27px}
.v-c .nav button[aria-current=page]{flex-grow:2.4}
.v-c .nav button[aria-current=page] .lbl{max-width:80px;opacity:1}
/* D 꽉 채움 + 모든 칸 아이콘 아래 이름 */
.v-d .nav{--inset:4px;--cap-h:54px;--cap-r:27px}
.v-d .nav button{flex-direction:column;gap:3px}
.v-d .lbl{max-width:none;opacity:1;font:500 11px/1 var(--font-sans);color:var(--color-fg-secondary);overflow:visible}
.v-d .nav button[aria-current=page] .lbl{color:var(--gnb-icon-active);font-weight:600}
.v-d .sym{width:22px;height:22px}.v-d .sym svg{width:22px;height:22px}
.v-d .ava{width:26px;height:26px}
.v-d .badge{top:-2px}
@media (prefers-reduced-motion:reduce){.cap,.nav button,.lbl{transition:none}.nav button:active{transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">YAHWA · 하단 메뉴 (GNB) · 선택 칩</p>
  <h1 class="title">선택된 칸의 알약칩 크기</h1>
  <p class="intro">지금 칩은 위아래로 8px씩 떠 있어서(48 × 60) 메뉴 안에 작은 칩이 하나 더 있는 것처럼 보여요. 떠 있는 하단 메뉴는 보통 칩이 메뉴를 거의 꽉 채우고, 칩 모서리를 메뉴 모서리와 같은 곡선으로 맞춰요(메뉴 32 − 안쪽 4 = 칩 27~28). 각 메뉴 아이콘을 눌러 칩이 옮겨 가는 모습도 볼 수 있어요.</p>
  <div class="zoom" role="group" aria-label="보기 크기"><span>보기</span><button type="button" data-z="1" aria-pressed="true">실제 크기</button><button type="button" data-z="1.6" aria-pressed="false">크게 보기</button></div>
  <div class="grid" id="grid"></div>
</div>
<script>
const ICONS=[
 {id:'discovery',name:'인연 홈',badge:false,line:'<rect x="3" y="3" width="7" height="8" rx="2"/><rect x="14" y="3" width="7" height="8" rx="2"/><rect x="3" y="15" width="7" height="6" rx="2"/><rect x="14" y="15" width="7" height="6" rx="2"/>',fill:'<rect x="2.25" y="2.25" width="8.5" height="9.5" rx="2.5"/><rect x="13.25" y="2.25" width="8.5" height="9.5" rx="2.5"/><rect x="2.25" y="14.25" width="8.5" height="7.5" rx="2.5"/><rect x="13.25" y="14.25" width="8.5" height="7.5" rx="2.5"/>',vb:24},
 {id:'heartbox',name:'마음함',badge:true,line:'<path d="M16 26C12 23 4.5 17.5 5 11.3C5.4 5.5 12.2 5.5 15.6 12.2C18.1 5.2 25.8 4.9 27 10.8C28.1 16.1 21.6 23.1 16 26Z"/>',fill:'<path d="M16 27C12 24 3.6 18 4 11.2C4.4 4.5 12.1 4.3 15.6 10.2C18.3 3.9 26.8 3.8 28 10.6C29.1 16.5 22 24 16 27Z"/>',vb:32},
 {id:'chats',name:'편지함',badge:true,line:'<path d="M3 6Q12 5 21 6V19H3Z M3 7L12 14L21 7 M3 19L9 13 M21 19L15 13"/>',fill:'<path d="M2.25 5.4Q12 4.2 21.75 5.4V19.75H2.25Z"/><path class="knock" d="M3 7L12 14L21 7 M3 19L9 13 M21 19L15 13"/>',vb:24},
 {id:'community',name:'커뮤니티',badge:true,line:'<path d="M4 5h16v12H9l-5 4V5M8 9h8M8 13h5"/>',fill:'<path d="M3.25 4.25h17.5v13.5H9.3l-6.05 4.8Z"/><path class="knock" d="M8 9h8M8 13h5"/>',vb:24},
 {id:'mypage',name:'MY',ava:true},
];
const V=[
 {k:'now',tag:'지금',name:'떠 있는 작은 칩',desc:'칩이 위아래 8px, 양옆도 칸 안쪽으로 떠 있어요. 메뉴 모서리(32)와 칩 모서리(24)의 곡선이 달라 두 겹으로 보여요.',spec:'칩 48 × 60 · 안쪽 8 · 모서리 24'},
 {k:'a',tag:'A',name:'꽉 채운 칩',desc:'칩이 메뉴를 사방 4px만 남기고 꽉 채워요. 칩 모서리를 메뉴와 같은 곡선(27)으로 맞춰 한 덩어리로 보여요. 색과 아이콘은 지금 그대로예요.',spec:'칩 54 × 62 · 안쪽 4 · 모서리 27'},
 {k:'b',tag:'B',name:'꽉 채운 흰 유리 칩',desc:'A와 같은 크기인데, 칩을 하늘색 대신 흰 유리처럼 띄워요. 반투명 메뉴 위에 한 겹 떠 있는 느낌이라 선택이 또렷해요.',spec:'칩 54 × 62 · 흰 92% · 옅은 그림자'},
 {k:'c',tag:'C',name:'꽉 채운 칩 + 선택한 칸 이름',desc:'선택한 칸만 넓어지며 아이콘 옆에 이름이 나와요. 지금 어디에 있는지 글자로도 알려 줘요. 칸을 바꾸면 칩이 늘었다 줄며 옮겨 가요.',spec:'선택 칸 약 2배 · 이름 13px'},
 {k:'d',tag:'D',name:'꽉 채운 칩 + 모든 칸 이름',desc:'모든 칸에 아이콘 아래 작은 이름(11px)을 달아요. 처음 쓰는 사람도 메뉴를 바로 알아봐요. 대신 아이콘이 22px로 조금 작아져요.',spec:'아이콘 22 · 이름 11px · 칩 54 × 62'},
];
const btn=(ic,i)=>`<button type="button" data-i="${i}" aria-label="${ic.name}${ic.badge?', 새 소식':''}">${ic.ava?'<span class="ava"><img src="img/me.jpg" alt=""></span>':`<span class="sym"><svg class="line" viewBox="0 0 ${ic.vb} ${ic.vb}" aria-hidden="true">${ic.line}</svg><svg class="fill" viewBox="0 0 ${ic.vb} ${ic.vb}" aria-hidden="true">${ic.fill}</svg>${ic.badge?'<span class="badge" aria-hidden="true"></span>':''}</span>`}<span class="lbl">${ic.name}</span></button>`;
const grid=document.getElementById('grid'),navs=[];
V.forEach(v=>{
  const it=document.createElement('article');it.className='item v-'+v.k+(v.k==='now'?' now':'');
  it.innerHTML=`<h2><b>${v.tag}</b>${v.name}</h2><div class="phone"><div class="card" aria-hidden="true"></div><div class="pager" aria-hidden="true"><i></i><span>06 / 08</span><i></i></div><nav class="nav" aria-label="앱 메뉴"><span class="cap no-anim" aria-hidden="true"></span>${ICONS.map(btn).join('')}</nav></div><p>${v.desc}</p><span class="spec">${v.spec}</span>`;
  grid.append(it);
  const nav=it.querySelector('.nav');navs.push(nav);
  nav.addEventListener('click',e=>{const b=e.target.closest('button');if(b)select(nav,+b.dataset.i);});
  /* C는 칸 너비가 늘고 줄어드는 동안 칩이 그 칸을 그대로 따라가요 */
  if(v.k==='c'){const ro=new ResizeObserver(()=>place(nav));nav.querySelectorAll('button').forEach(b=>ro.observe(b));}
  select(nav,0);
});
function place(nav){
  const cap=nav.querySelector('.cap'),cur=nav.querySelector('[aria-current=page]');if(!cur)return;
  /* 칩은 선택한 칸의 너비 그대로, 높이는 --cap-h */
  cap.style.width=cur.offsetWidth+'px';cap.style.transform=`translateX(${cur.offsetLeft}px)`;
}
function select(nav,i){
  nav.querySelectorAll('button').forEach((b,k)=>{if(k===i)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
  /* C는 칸 너비가 바뀌므로, 바뀐 뒤 자리를 따라가요 */
  const cap=nav.querySelector('.cap');
  if(nav.closest('.v-c')){cap.classList.add('no-anim');place(nav);}
  else{place(nav);}
  requestAnimationFrame(()=>requestAnimationFrame(()=>{if(!nav.closest('.v-c'))cap.classList.remove('no-anim');}));
}
addEventListener('resize',()=>navs.forEach(place));
document.querySelectorAll('.zoom button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.zoom button').forEach(x=>x.setAttribute('aria-pressed',x===b));document.body.classList.toggle('zoomed',b.dataset.z!=='1');navs.forEach(n=>{n.querySelector('.cap').classList.add('no-anim');place(n);});}));
</script>
</body>
</html>
