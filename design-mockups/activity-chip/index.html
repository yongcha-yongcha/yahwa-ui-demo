<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>최근활동 칩</title>
<link rel="stylesheet" href="tokens.css">
<style>
:root{--pg:#EEF2F4;--pg-surface:#FFFFFF;--pg-line:#DDE3E7;--pg-fg:#273037;--pg-fg2:#505C65;--pg-fg3:#69757E;--pg-accent:#377398;--pg-on:#fff;--a1:.85}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pg:#161C20;--pg-surface:#222A30;--pg-line:#34404A;--pg-fg:#E3E7EA;--pg-fg2:#CFD5DA;--pg-fg3:#98A2AA;--pg-accent:#92C0DF;--pg-on:#161C20;color-scheme:dark}}
:root[data-theme="dark"]{--pg:#161C20;--pg-surface:#222A30;--pg-line:#34404A;--pg-fg:#E3E7EA;--pg-fg2:#CFD5DA;--pg-fg3:#98A2AA;--pg-accent:#92C0DF;--pg-on:#161C20;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--pg);color:var(--pg-fg);font:400 14px/1.6 var(--font-sans);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
.wrap{max-width:1640px;margin:0 auto;padding:36px 16px 80px}
.eyebrow{margin:0;font-size:12px;letter-spacing:2px;color:var(--pg-fg3)}
h1.title{margin:6px 0 0;font:400 30px/1.35 var(--font-serif)}
.intro{max-width:96ch;margin:10px 0 0;color:var(--pg-fg2)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:18px}
.tools button{height:36px;padding:0 14px;border:0;border-radius:18px;background:var(--pg-surface);box-shadow:inset 0 0 0 1px var(--pg-line);color:var(--pg-fg);font:600 12px var(--font-sans);cursor:pointer}
.tools button[aria-pressed="true"]{box-shadow:inset 0 0 0 1.5px var(--pg-accent);color:var(--pg-accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;margin-top:22px}
.tile{padding:16px;border-radius:20px;background:var(--pg-surface);box-shadow:inset 0 0 0 1px var(--pg-line)}
.tile h3{margin:0;display:flex;align-items:center;gap:8px;font:400 17px/1.4 var(--font-serif)}
.tile h3 b{display:grid;place-items:center;min-width:28px;height:24px;padding:0 8px;border-radius:12px;background:var(--pg-accent);color:var(--pg-on);font:600 11px var(--font-sans)}
.tile h3 b.now{background:var(--pg-line);color:var(--pg-fg2)}
.tile h3 em{font:600 11px/1 var(--font-sans);font-style:normal;padding:4px 8px;border-radius:10px;background:var(--sky-100);color:var(--color-fg-accent-strong)}
.tile p{margin:6px 0 12px;min-height:44px;font-size:12px;line-height:1.6;color:var(--pg-fg2)}
.spec{display:block;margin-top:10px;font:500 11px/1.5 ui-monospace,Menlo,monospace;color:var(--pg-fg3)}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.ctx{position:relative;aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:var(--color-bg-muted)}
.ctx .ph{position:absolute;inset:0;background:center 35%/cover}
.ctx.blur .ph{inset:-20px;filter:blur(12px) saturate(1.1)}
.ctx.paper{aspect-ratio:3/4;background:var(--paper);box-shadow:inset 0 0 0 1px var(--color-border-default)}
.ctx.paper .nm{position:absolute;left:10px;top:40px;font:400 18px/1.3 var(--font-serif);color:var(--color-fg-primary)}
.ctx.paper .mt{position:absolute;left:10px;top:66px;font:400 10px/1.4 var(--font-sans);color:var(--color-fg-muted)}
.ctx small.cap{position:absolute;left:0;right:0;bottom:6px;text-align:center;font:500 10px/1 var(--font-sans);color:#fff;text-shadow:0 1px 4px rgb(0 0 0 / .4)}
.ctx.paper small.cap{color:var(--pg-fg3);text-shadow:none}
.chip{position:absolute;left:8px;top:8px;display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:12px;font:500 12px/1 var(--font-sans);white-space:nowrap}
.chip i{flex:none;width:5px;height:5px;border-radius:50%}

/* 지금 */
.v0 .chip{background:var(--sage-50);color:var(--sage-700)}.v0 .chip i{background:var(--sage-500)}
/* O1 배경만 반투명 (슬라이더) */
.v1 .chip{background:color-mix(in srgb,var(--sage-50) calc(var(--a1) * 100%),transparent);color:var(--sage-700)}.v1 .chip i{background:var(--sage-500)}
/* O2 반투명 + 흐림 (세이지 유리) */
.v2 .chip{background:color-mix(in srgb,var(--sage-50) 68%,transparent);-webkit-backdrop-filter:blur(8px) saturate(140%);backdrop-filter:blur(8px) saturate(140%);color:var(--sage-800)}.v2 .chip i{background:var(--sage-500)}
/* O3 흰 유리 */
.v3 .chip{background:rgb(255 255 255 / .58);-webkit-backdrop-filter:blur(12px) saturate(150%);backdrop-filter:blur(12px) saturate(150%);box-shadow:inset 0 0 0 1px rgb(255 255 255 / .5);color:var(--sage-800)}.v3 .chip i{background:var(--sage-500)}
/* O4 어두운 유리 */
.v4 .chip{background:rgb(20 32 28 / .32);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff}.v4 .chip i{background:var(--sage-300)}
.v4 .ctx.paper .chip{background:color-mix(in srgb,var(--sage-700) 85%,transparent);-webkit-backdrop-filter:none;backdrop-filter:none}
/* O5 칩 전체 투명도 */
.v5 .chip{background:var(--sage-50);color:var(--sage-700);opacity:.82}.v5 .chip i{background:var(--sage-500)}
/* D1 바탕 없이 점 + 글 */
.v6 .chip{padding:0 2px;background:none;color:#fff;text-shadow:0 1px 6px rgb(0 0 0 / .45);font-weight:600}.v6 .chip i{width:6px;height:6px;background:var(--sage-300);box-shadow:0 0 0 2px rgb(255 255 255 / .35)}
.v6 .ctx.paper .chip{color:var(--sage-700);text-shadow:none}.v6 .ctx.paper .chip i{background:var(--sage-500);box-shadow:0 0 0 2px var(--sage-100)}
/* D2 숨 쉬는 점 */
.v7 .chip{background:rgb(255 255 255 / .82);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:var(--sage-700)}.v7 .chip i{position:relative;background:var(--sage-500)}
.v7 .chip i::after{content:"";position:absolute;inset:-3px;border-radius:50%;background:var(--sage-400);opacity:.5;animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{transform:scale(.6);opacity:.55}70%,100%{transform:scale(1.9);opacity:0}}
.still .v7 .chip i::after{animation:none;opacity:0}
/* B1 테두리만 */
.v8 .chip{background:rgb(255 255 255 / .16);box-shadow:inset 0 0 0 1px rgb(255 255 255 / .65);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:#fff}.v8 .chip i{background:var(--sage-200)}
.v8 .ctx.paper .chip{background:none;box-shadow:inset 0 0 0 1px var(--sage-300);color:var(--sage-700)}.v8 .ctx.paper .chip i{background:var(--sage-500)}
/* B2 한 단계 진한 세이지 + 테두리 85% */
.v9 .chip{background:color-mix(in srgb,var(--sage-100) 85%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--sage-200) 80%,transparent);color:var(--sage-800)}.v9 .chip i{background:var(--sage-600)}
/* B3 작은 알약 · 글자 11 · 높이 20 */
.v10 .chip{height:20px;padding:0 7px;border-radius:10px;background:color-mix(in srgb,var(--sage-50) 78%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:var(--sage-700);font-size:11px}.v10 .chip i{width:4px;height:4px;background:var(--sage-500)}
.slider{display:flex;align-items:center;gap:8px;margin-top:10px;font:500 12px var(--font-sans);color:var(--pg-fg2)}
.slider input{flex:1}
@media (prefers-reduced-motion:reduce){.v7 .chip i::after{animation:none;opacity:0}}
</style>
</head>
<body>
<div class="wrap">
<p class="eyebrow">YAHWA · Activity Chip</p>
<h1 class="title">최근활동 칩</h1>
<p class="intro">인연 카드 · 상대 프로필 사진 위에 얹히는 “최근활동” 칩이에요. 지금은 세이지 50 꽉 찬 바탕이라 사진 위에서 스티커처럼 떠 보여요. 투명도 버전(O1~O5), 바탕을 덜어낸 버전(D1 · D2), 테두리 · 크기 버전(B1~B3)을 사진 세 가지(흐린 공개 전 카드 · 밝은 사진 · 종이 바탕 프로필) 위에 같이 놓았어요.</p>
<div class="tools"><button id="still" aria-pressed="false">움직임 멈추기</button></div>
<div class="grid" id="grid"></div>
</div>
<script>
const V=[
 ['v0','now','지금','세이지 50 꽉 찬 바탕 · 세이지 700 글자 · 점 5. 어디서나 잘 읽히지만 사진 위에서 가장 무겁게 떠 보여요.','bg sage-50 100% · fg sage-700'],
 ['v1','O1','배경만 반투명','바탕 투명도만 낮춰요. 글자 · 점은 그대로라 읽기 쉬움을 지키면서 사진이 살짝 비쳐요. 슬라이더로 값을 골라 보세요.','bg sage-50 <span id="a1v">85</span>% · fg sage-700',true],
 ['v2','O2','세이지 유리','바탕 68% + 뒤 흐림 8. 비쳐 보이는 사진이 뭉개져서 글자가 흔들리지 않아요. 앱의 머리 줄 흐림과 같은 결이에요.','bg sage-50 68% · blur 8 · fg sage-800'],
 ['v3','O3','흰 유리','흰 58% + 흐림 12 + 안쪽 흰 테두리. 어떤 사진 위에서도 가장 가볍고 깨끗해요. 세이지 색은 점과 글자에만.','bg white 58% · blur 12 · fg sage-800'],
 ['v4','O4','어두운 유리','어두운 32% + 흐림 10, 흰 글자. 밝은 사진 위에서 가장 또렷하지만 파스텔 무드와는 조금 멀어요. 종이 바탕에서는 진한 세이지로.','bg #14201C 32% · blur 10 · fg white'],
 ['v5','O5','칩 전체 투명도','바탕 · 글자 · 점을 한꺼번에 82%로. 가장 간단하지만 글자까지 옅어져서 작은 12px 글이 흐려 보일 수 있어요.','opacity .82 (전체)'],
 ['v6','D1','바탕 없이 점 + 글','상자를 없애고 점 6 + 흰 굵은 글 + 그림자만. 사진을 가장 덜 가려요. 밝은 사진에서는 그림자에 기대야 해요.','no bg · fg white 600 · text-shadow'],
 ['v7','D2','숨 쉬는 점','흰 82% 유리 + 점 둘레가 2.4초마다 퍼졌다 사라져요. “지금 활동 중” 느낌이 가장 살아요. 움직임 줄이기면 멈춰요.','bg white 82% · blur 8 · dot pulse 2.4s'],
 ['v8','B1','테두리만','흰 16% 바탕 + 흰 65% 테두리 1px + 흐림 6. 필름 사진 위 손글씨 스티커처럼 가볍고, 종이 바탕에서는 세이지 테두리만.','bg white 16% · ring white 65% · fg white'],
 ['v9','B2','한 단계 진한 세이지','세이지 100 85% + 세이지 200 테두리. 지금보다 색이 분명해 “활동 표시”로 바로 읽혀요. 투명도는 살짝만.','bg sage-100 85% · ring sage-200 · fg sage-800'],
 ['v10','B3','작은 알약','높이 20 · 글자 11 · 점 4 · 바탕 78% + 흐림 6. 사진을 가장 적게 가리고, 인증 배지 같은 작은 표시들과 크기가 맞아요.','h20 · 11px · bg sage-50 78% · blur 6'],
];
const ctx=(cls,src,cap)=>'<div class="ctx '+cls+'">'+(src?'<span class="ph" style="background-image:url('+src+')"></span>':'<span class="nm">하늘조각</span><span class="mt">28세 · 서울 마포구</span>')+'<span class="chip"><i></i>최근활동</span><small class="cap">'+cap+'</small></div>';
document.getElementById('grid').innerHTML=V.map(([c,tag,t,d,spec,sl])=>'<div class="tile '+c+'"><h3><b class="'+(tag==='now'?'now':'')+'">'+(tag==='now'?'지금':tag)+'</b>'+t+(c==='v3'?'<em>추천</em>':'')+'</h3><p>'+d+'</p><div class="row">'+ctx('blur','person-07-3.jpg','공개 전 카드')+ctx('','p3.jpg','밝은 사진')+ctx('paper','','프로필 바탕')+'</div>'+(sl?'<label class="slider">투명도<input type="range" id="a1" min="40" max="100" value="85"></label>':'')+'<span class="spec">'+spec+'</span></div>').join('');
const a1=document.getElementById('a1');a1.oninput=()=>{document.documentElement.style.setProperty('--a1',a1.value/100);document.getElementById('a1v').textContent=a1.value;};
document.getElementById('still').onclick=e=>{const on=e.currentTarget.getAttribute('aria-pressed')!=='true';e.currentTarget.setAttribute('aria-pressed',on);document.body.classList.toggle('still',on);};
</script>
</body>
</html>
