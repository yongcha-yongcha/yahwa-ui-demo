<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>웰컴에서 휴대폰 인증까지</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="tokens.css">
<style>
/* 레이아웃: 위 설명과 공통 버튼, 아래 휴대폰 세 대. 휴대폰마다 웰컴 → 가입 · 로그인 → 휴대폰 인증을 직접 눌러 이동(뒤로 버튼도 동작) */
:root{--pg:#EEF2F4;--pg-surface:#FFFFFF;--pg-line:#DDE3E7;--pg-fg:#273037;--pg-fg2:#505C65;--pg-fg3:#69757E;--pg-accent:#377398}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pg:#161C20;--pg-surface:#222A30;--pg-line:#34404A;--pg-fg:#E3E7EA;--pg-fg2:#CFD5DA;--pg-fg3:#98A2AA;--pg-accent:#92C0DF;color-scheme:dark}}
:root[data-theme="dark"]{--pg:#161C20;--pg-surface:#222A30;--pg-line:#34404A;--pg-fg:#E3E7EA;--pg-fg2:#CFD5DA;--pg-fg3:#98A2AA;--pg-accent:#92C0DF;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--pg);color:var(--pg-fg);font:400 14px/1.6 var(--font-sans);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding-block:36px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{margin:0;font-size:12px;letter-spacing:2px;color:var(--pg-fg3)}
h1.title{margin:6px 0 0;font:400 30px/1.35 var(--font-serif)}
.intro{max-width:72ch;margin:10px 0 0;color:var(--pg-fg2)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;margin-top:20px}
.bar label{font-size:13px;color:var(--pg-fg2)}
.bar input[type=range]{width:180px;max-width:100%;accent-color:var(--pg-accent)}
.bar output{min-width:44px;font-size:13px;font-variant-numeric:tabular-nums}
.tool{height:44px;padding:0 16px;border:0;border-radius:12px;background:var(--pg-accent);color:#fff;font-weight:600;cursor:pointer}
.tool.ghost{background:var(--pg-surface);color:var(--pg-fg);box-shadow:inset 0 0 0 1px var(--pg-line)}
.tool:focus-visible{outline:2px solid var(--pg-accent);outline-offset:3px}
.grid{display:flex;flex-wrap:wrap;gap:28px 24px;margin-top:24px}
.item{flex:0 1 360px;min-width:0;display:flex;flex-direction:column;gap:10px}
.item h2{margin:0;display:flex;align-items:center;gap:8px;font:400 18px/1.4 var(--font-serif)}
.item h2 b{display:grid;place-items:center;min-width:26px;height:26px;padding:0 6px;border-radius:13px;background:var(--pg-accent);color:#fff;font:600 12px var(--font-sans)}
.item.now h2 b{background:var(--pg-fg3)}
.item>p{margin:0;font-size:13px;color:var(--pg-fg2)}
.item .feel{font-size:12px;color:var(--pg-fg3)}
.item .run{display:flex;gap:8px}
.item .run button{flex:1;height:40px;border:0;border-radius:10px;background:var(--pg-surface);box-shadow:inset 0 0 0 1px var(--pg-line);font-size:12px;cursor:pointer}

/* ───────── 휴대폰 (앱 토큰, 360 × 780) ───────── */
.phone{position:relative;width:360px;max-width:100%;height:780px;border-radius:32px;overflow:hidden;background:var(--color-bg-page);box-shadow:0 0 0 1px var(--pg-line),0 16px 40px rgb(0 0 0 / .12);color:var(--color-fg-primary);isolation:isolate}
.scr{position:absolute;inset:0;background:var(--color-bg-page)}
.scr[hidden]{display:none}
/* 웰컴 */
.w{background:linear-gradient(rgb(146,192,223),rgb(227,231,234) 220px);overflow:hidden}
.w .photo{position:absolute;left:-144px;top:-135px;width:504px;height:834px;object-fit:cover}
.w .say{position:absolute;left:16px;right:16px;top:51px;margin:0;text-align:center;font:italic 23px/1.65 var(--font-serif);letter-spacing:-.8px;color:#fff}
.w .logo{position:absolute;left:3px;top:129px;width:345px;height:200px;object-fit:contain;filter:brightness(0) invert(1)}
.w .heart{position:absolute;left:146px;top:349px;width:79px;height:83px;object-fit:contain;filter:brightness(0) invert(1)}
.w .sheet{position:absolute;left:0;right:0;top:592px;bottom:0;padding:24px 20px 0;border-radius:26px 26px 0 0;background:var(--color-bg-page)}
.w .chap{margin:0 0 16px;text-align:center;font-size:9px;letter-spacing:2.8px;color:var(--sky-400)}
.w .start{width:100%;height:59px;border:0;border-radius:17px;background:var(--color-bg-button-primary);color:#fff;font:20px var(--font-serif);letter-spacing:-.6px;display:flex;align-items:center;justify-content:center;gap:12px;cursor:pointer}
.w .start i{width:20px;height:20px;background:currentColor;-webkit-mask:var(--ic-chevron-right) center/contain no-repeat;mask:var(--ic-chevron-right) center/contain no-repeat}
.w .login{display:block;width:100%;height:44px;margin-top:8px;border:0;background:none;font:500 14px var(--font-sans);color:var(--color-fg-secondary);text-decoration:underline;text-underline-offset:5px;cursor:pointer}
/* 공통 위쪽 */
.top{height:44px;margin:24px 20px 0;display:flex;align-items:center}
.back{width:44px;height:44px;margin-left:-10px;border:0;background:none;display:grid;place-items:center;cursor:pointer}
.back i{width:24px;height:24px;background:var(--color-fg-primary);-webkit-mask:var(--ic-chevron-left-large) center/contain no-repeat;mask:var(--ic-chevron-left-large) center/contain no-repeat}
.prog{height:3px;margin:16px 20px 0;border-radius:3px;background:var(--color-bg-notice)}
.prog i{display:block;height:100%;border-radius:3px;background:var(--color-bg-button-primary)}
.body{padding:0 20px}
.h{margin:0 0 14px;font:400 26px/1.5 var(--font-serif);letter-spacing:-.8px}
.lead{margin:0;font-size:12px;line-height:1.8;color:var(--color-fg-tertiary)}
/* 가입 · 로그인 */
.a .alogo{display:block;width:96px;height:56px;margin:4px 0 14px;object-fit:contain;object-position:left center}
.a .art{display:block;width:150px;height:98px;margin:52px auto 0}
.a .opts{position:absolute;left:20px;right:20px;bottom:56px;display:grid;gap:10px}
.a .m{height:50px;border-radius:14px;border:0;display:flex;align-items:center;justify-content:center;gap:8px;font:600 14px var(--font-sans);cursor:pointer}
.a .m.p{background:var(--color-bg-button-primary);color:#fff}
.a .m.k{background:#FEE500;color:#191919}
.a .m.k svg{width:16px;height:16px;fill:#191919}
.a .m.ap{background:#fff;color:#000;box-shadow:inset 0 0 0 1.5px #000}
.a .m.ap img{width:14px;height:16px;object-fit:contain}
.a .foot{position:absolute;left:0;right:0;bottom:22px;display:flex;justify-content:center;gap:32px;font-size:11px;color:var(--color-fg-tertiary);text-decoration:underline;text-underline-offset:3px}
/* 휴대폰 인증 */
.v .body{padding-top:38px}
.v .fl{display:block;margin:28px 0 8px;font-size:12px}
.v .inp{height:50px;border:1px solid var(--color-border-control);border-radius:12px;background:var(--color-bg-surface);padding:0 14px;display:flex;align-items:center;font-size:15px}
.v .hint{margin:10px 0 0;font-size:11px;color:var(--color-fg-tertiary)}
.v .bot{position:absolute;left:20px;right:20px;bottom:26px}
.v .cta{width:100%;height:52px;border:0;border-radius:14px;background:var(--color-bg-button-primary);color:#fff;font:500 15px var(--font-sans)}
.v .demo{margin:10px 0 0;font-size:10px;color:var(--color-fg-muted);text-align:center}
.cover{position:absolute;left:0;right:0;top:0;height:780px;z-index:5;background:var(--color-bg-page);border-radius:26px 26px 0 0;pointer-events:none}
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">YAHWA · 가입 흐름 · 화면 전환</p>
  <h1 class="title">웰컴에서 휴대폰 인증까지</h1>
  <p class="intro">지금은 웰컴 → 가입 · 로그인 → 휴대폰 인증이 모두 화면 전체가 오른쪽에서 밀려 들어와요. 그 뒤 인증부터 소개 미리보기까지는 내용만 떠오르는 방식이라 여기서 결이 달라져요. 휴대폰 안의 버튼("우리의 첫 장면 시작하기", "휴대폰 번호로 계속하기", 뒤로 가기)을 직접 눌러 보거나, 아래 버튼으로 한 번에 재생해 보세요.</p>
  <div class="bar">
    <label for="spd">속도 배율</label><input type="range" id="spd" min="0.5" max="3" step="0.1" value="1"><output id="o-spd" for="spd">1.0배</output>
    <button type="button" class="tool" id="all">전체 흐름 재생</button>
    <button type="button" class="tool ghost" id="reset">처음 화면으로</button>
  </div>
  <div class="grid" id="grid"></div>
</div>

<template id="tpl">
  <div class="phone">
    <section class="scr w" aria-label="웰컴">
      <img class="photo" src="img/couple.jpg" alt="">
      <p class="say">좋은 인연의 시작은 생각보다<br>평범한 순간에 있으니까.</p>
      <img class="logo" src="img/yahwa-blue.png" alt="야화"><img class="heart" src="img/heart-tilt.png" alt="">
      <div class="sheet"><p class="chap">THE FIRST FRAME</p><button type="button" class="start" data-to="a">우리의 첫 장면 시작하기 <i aria-hidden="true"></i></button><button type="button" class="login" data-to="a">이미 야화와 함께하고 있어요</button></div>
    </section>
    <section class="scr a" aria-label="가입 · 로그인" hidden>
      <div class="top"><button type="button" class="back" data-to="w" aria-label="웰컴으로 돌아가기"><i></i></button></div>
      <div class="body">
        <img class="alogo" src="img/yahwa-blue.png" alt="야화">
        <h3 class="h">우리의 이야기를<br>시작해요.</h3>
        <p class="lead">나의 일상이 궁금한 한 사람.<br>그 만남의 첫걸음을 함께해요.</p>
        <svg class="art" viewBox="0 0 170 110" aria-hidden="true"><path d="M27 76C50 92 109 95 147 68C154 63 148 57 137 61" fill="none" stroke="var(--color-fg-accent-soft)" stroke-width="1.4" stroke-linecap="round"/><path d="M46 23L119 17L128 74L51 81Z" fill="var(--color-fg-inverse-muted)"/><path d="M40 28L113 22L122 79L45 85Z M40 28L80 55L113 22" fill="none" stroke="var(--color-fg-accent)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M79 49C67 35 59 49 79 65C99 48 91 36 79 49Z" fill="var(--color-bg-page)" stroke="var(--color-fg-accent)" stroke-width="1.3"/><path d="M131 26L137 20M139 35L147 34" stroke="var(--color-fg-accent-soft)" stroke-width="1.5" stroke-linecap="round"/></svg>
      </div>
      <div class="opts"><button type="button" class="m p" data-to="v">휴대폰 번호로 계속하기</button><button type="button" class="m k"><svg viewBox="61.5 16.5 13 13" aria-hidden="true"><path d="M68.001 16.5225C64.4222 16.5225 61.5225 19.0037 61.5225 22.0641C61.5225 24.0312 62.7219 25.7596 64.5292 26.7423L63.9181 29.2113C63.8954 29.285 63.9132 29.364 63.9619 29.4184C63.9975 29.457 64.0461 29.478 64.0931 29.478C64.1337 29.478 64.1742 29.464 64.2082 29.4341L66.834 27.5144C67.2117 27.5723 67.6007 27.6039 67.9994 27.6039C71.5767 27.6039 74.478 25.1226 74.478 22.0623C74.478 19.002 71.5783 16.5225 68.001 16.5225Z"/></svg>카카오 로그인</button><button type="button" class="m ap"><img src="img/apple.png" alt="">Apple로 계속하기</button></div>
      <p class="foot"><span>이용약관</span><span>개인정보처리방침</span></p>
    </section>
    <section class="scr v" aria-label="휴대폰 인증" hidden>
      <div class="top"><button type="button" class="back" data-to="a" aria-label="가입 · 로그인으로 돌아가기"><i></i></button></div>
      <div class="prog"><i style="width:33.33%"></i></div>
      <div class="body"><h3 class="h">안심할 수 있는<br>만남의 첫걸음.</h3><p class="lead">본인 명의의 휴대폰으로 확인해요.<br>휴대폰 번호는 프로필에 표시되지 않아요.</p><span class="fl">휴대폰 번호</span><div class="inp">01000000000</div><p class="hint">실제 번호 대신 예시 번호로 체험해 주세요.</p></div>
      <div class="bot"><button type="button" class="cta">인증번호 받기</button><p class="demo">UI 시연 · 입력 정보는 저장하거나 전송하지 않아요</p></div>
    </section>
  </div>
</template>

<script>
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let K=1;const T=ms=>ms*K;
const DRAWER='cubic-bezier(.32,.72,0,1)',OUT='cubic-bezier(.23,1,.32,1)';
/* 앱 값 그대로 (transitions.js STEP_MOTION) */
const M={rise:30,duration:800,stagger:50,exit:100};
const SPRING='linear('+Array.from({length:41},(_,i)=>{const t=i/40;return i===40?1:+(1-Math.exp(-9*t)*(1+9*t)).toFixed(4)}).join(',')+')';
const ITEMS={
  w:s=>[s.querySelector('.say'),s.querySelector('.logo'),s.querySelector('.heart'),...s.querySelector('.sheet').children],
  a:s=>[...s.querySelector('.body').children,...s.querySelector('.opts').children,s.querySelector('.foot')],
  v:s=>[...s.querySelector('.body').children,s.querySelector('.bot')],
};
const scr=(p,k)=>p.querySelector('.scr.'+k);
function riseIn(p,k,start=0,cap=Infinity){ITEMS[k](scr(p,k)).forEach((c,i)=>{const d=start+Math.min(i,cap)*M.stagger;
  c.animate([{transform:`translateY(${M.rise}px)`},{transform:'none'}],{duration:T(M.duration),delay:T(d),easing:SPRING,fill:'backwards'});
  c.animate([{opacity:0},{opacity:1}],{duration:T(M.duration/2),delay:T(d),easing:OUT,fill:'backwards'});});}
function fadeOut(p,k,d=M.exit){return ITEMS[k](scr(p,k)).map(c=>c.animate([{opacity:1},{opacity:0}],{duration:T(d),easing:'ease-out',fill:'forwards'}));}
function swapTo(p,from,to){scr(p,from).hidden=true;scr(p,to).hidden=false;}
function refill(p,k){const bar=scr(p,k).querySelector('.prog');if(!bar)return;const i=bar.firstElementChild;
  bar.animate([{opacity:0},{opacity:1}],{duration:T(200),easing:OUT,fill:'backwards'});
  i.animate([{width:'0%'},{width:i.style.width}],{duration:T(520),delay:T(180),easing:DRAWER,fill:'backwards'});}
/* 공통: 같은 흐름 안(가입 · 로그인 ↔ 휴대폰 인증)은 내용이 사라졌다 떠오르기, 진행바는 새로 채움 */
function riseSwap(p,from,to){const out=fadeOut(p,from);(out[0]?.finished||Promise.resolve()).then(()=>{swapTo(p,from,to);riseIn(p,to);refill(p,to);});}
function slide(p,from,to,dir){const a=scr(p,from),b=scr(p,to);b.hidden=false;
  if(dir>0){b.style.zIndex=2;a.style.zIndex=1;b.animate([{transform:'translateX(100%)'},{transform:'none'}],{duration:T(300),easing:DRAWER});a.animate([{transform:'none',opacity:1},{transform:'translateX(-24%)',opacity:.72}],{duration:T(300),easing:DRAWER}).finished.then(()=>{a.hidden=true;a.style.zIndex=b.style.zIndex='';});}
  else{a.style.zIndex=2;b.style.zIndex=1;a.animate([{transform:'none'},{transform:'translateX(100%)'}],{duration:T(280),easing:DRAWER}).finished.then(()=>{a.hidden=true;a.style.zIndex=b.style.zIndex='';});b.animate([{transform:'translateX(-24%)',opacity:.72},{transform:'none',opacity:1}],{duration:T(280),easing:DRAWER});}}
const ORDER=['w','a','v'];
const V=[
 {key:'now',tag:'지금',name:'밀려 들어옴',desc:'세 화면 모두 오른쪽에서 밀려 들어오고, 뒤로 가면 오른쪽으로 빠져요(300ms). 인증 다음 화면부터는 떠오르기라 여기서 결이 달라요.',feel:'여기만 다른 방식',
  go(p,from,to){slide(p,from,to,ORDER.indexOf(to)>ORDER.indexOf(from)?1:-1);}},
 {key:'rise',tag:'A',name:'떠오르기 + 사진 천천히',desc:'웰컴의 사진과 글이 0.26초 동안 천천히 옅어지며 살짝 커지고, 가입 · 로그인 내용이 아래에서 떠올라요. 가입 · 로그인 → 휴대폰 인증은 방금 바꾼 B안과 같아요(진행바 새로 채움).',feel:'한 흐름 · 가벼움',
  go(p,from,to){
   if(from==='w'){const w=scr(p,'w');w.querySelector('.photo').animate([{opacity:1,transform:'none'},{opacity:0,transform:'scale(1.04)'}],{duration:T(260),easing:'ease-out',fill:'forwards'});
     w.animate([{opacity:1},{opacity:1,offset:.6},{opacity:0}],{duration:T(260),fill:'forwards'});
     fadeOut(p,'w',140);setTimeout(()=>{swapTo(p,'w','a');w.getAnimations({subtree:true}).forEach(a=>a.cancel());riseIn(p,'a');},T(200));return;}
   if(to==='w'){fadeOut(p,'a');setTimeout(()=>{swapTo(p,'a','w');const w=scr(p,'w');w.animate([{opacity:0},{opacity:1}],{duration:T(320),easing:OUT,fill:'backwards'});w.querySelector('.photo').animate([{transform:'scale(1.04)'},{transform:'none'}],{duration:T(700),easing:OUT});riseIn(p,'w',120);},T(M.exit));return;}
   riseSwap(p,from,to);}},
 {key:'sheet',tag:'B',name:'바텀시트가 펼쳐짐',desc:'웰컴 아래쪽 흰 시트가 위로 쭉 올라와 화면을 덮고, 그 위로 가입 · 로그인 내용이 떠올라요. 사진은 시트에 밀려 살짝 올라가며 어두워져요. 뒤로 가면 시트가 다시 내려가요. 가입 · 로그인 → 휴대폰 인증은 B안과 같아요.',feel:'웰컴과 가입이 한 덩어리 · 가장 자연스러움',
  go(p,from,to){
   if(from==='w'){const w=scr(p,'w'),c=document.createElement('div');c.className='cover';p.append(c);
     [...w.querySelector('.sheet').children].forEach(e=>e.animate([{opacity:1},{opacity:0}],{duration:T(120),fill:'forwards'}));
     w.querySelector('.photo').animate([{transform:'none',filter:'brightness(1)'},{transform:'translateY(-48px)',filter:'brightness(.86)'}],{duration:T(520),easing:DRAWER,fill:'forwards'});
     [w.querySelector('.say'),w.querySelector('.logo'),w.querySelector('.heart')].forEach(e=>e.animate([{opacity:1,transform:'none'},{opacity:0,transform:'translateY(-24px)'}],{duration:T(360),easing:'ease-out',fill:'forwards'}));
     const up=c.animate([{transform:'translateY(592px)',borderRadius:'26px 26px 0 0'},{transform:'translateY(0)',borderRadius:'0 0 0 0'}],{duration:T(520),easing:DRAWER,fill:'forwards'});
     setTimeout(()=>{swapTo(p,'w','a');riseIn(p,'a');},T(300));
     up.finished.then(()=>{c.remove();w.getAnimations({subtree:true}).forEach(a=>a.cancel());});return;}
   if(to==='w'){const out=fadeOut(p,'a');(out[0]?.finished||Promise.resolve()).then(()=>{const w=scr(p,'w'),c=document.createElement('div');c.className='cover';p.append(c);swapTo(p,'a','w');
     const dn=c.animate([{transform:'translateY(0)',borderRadius:'0 0 0 0'},{transform:'translateY(592px)',borderRadius:'26px 26px 0 0'}],{duration:T(480),easing:DRAWER,fill:'forwards'});
     w.querySelector('.photo').animate([{transform:'translateY(-48px)',filter:'brightness(.86)'},{transform:'none',filter:'brightness(1)'}],{duration:T(480),easing:DRAWER});
     [w.querySelector('.say'),w.querySelector('.logo'),w.querySelector('.heart')].forEach((e,i)=>e.animate([{opacity:0,transform:'translateY(-16px)'},{opacity:1,transform:'none'}],{duration:T(500),delay:T(160+i*60),easing:OUT,fill:'backwards'}));
     dn.finished.then(()=>{c.remove();[...w.querySelector('.sheet').children].forEach((e,i)=>e.animate([{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'none'}],{duration:T(320),delay:T(i*50),easing:OUT,fill:'backwards'}));});});return;}
   riseSwap(p,from,to);}},
];
const grid=document.getElementById('grid'),tpl=document.getElementById('tpl'),phones=[];
V.forEach((v,i)=>{
  const it=document.createElement('article');it.className='item'+(i===0?' now':'');
  it.innerHTML=`<h2><b>${v.tag}</b>${v.name}</h2>`;
  const ph=tpl.content.firstElementChild.cloneNode(true);ph.dataset.v=i;ph.dataset.at='w';it.append(ph);
  it.insertAdjacentHTML('beforeend',`<div class="run"><button type="button" data-go="a">웰컴 → 가입</button><button type="button" data-go="v">→ 휴대폰 인증</button><button type="button" data-go="back">뒤로</button></div><p>${v.desc}</p><span class="feel">느낌 · ${v.feel}</span>`);
  grid.append(it);phones.push(ph);
  ph.addEventListener('click',e=>{const b=e.target.closest('[data-to]');if(b)go(ph,b.dataset.to);});
  it.querySelector('.run').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(!b)return;const at=ph.dataset.at;
    if(b.dataset.go==='back'){if(at!=='w')go(ph,ORDER[ORDER.indexOf(at)-1]);return;}
    if(b.dataset.go==='a'){if(at!=='w')reset(ph);go(ph,'a');return;}
    if(at==='w'){reset(ph);scr(ph,'w').hidden=true;scr(ph,'a').hidden=false;ph.dataset.at='a';}go(ph,'v');});
});
function reset(ph){ph.getAnimations({subtree:true}).forEach(a=>a.cancel());ph.querySelectorAll('.cover').forEach(c=>c.remove());ph.querySelectorAll('.scr').forEach(s=>{s.hidden=!s.classList.contains('w');s.style.zIndex='';});ph.dataset.at='w';}
function go(ph,to){const from=ph.dataset.at;if(from===to)return;
  ph.getAnimations({subtree:true}).forEach(a=>a.finish());ph.querySelectorAll('.cover').forEach(c=>c.remove());
  ph.dataset.at=to;
  if(reduce){const a=scr(ph,from),b=scr(ph,to);a.hidden=true;b.hidden=false;b.animate([{opacity:0},{opacity:1}],{duration:200});return;}
  V[ph.dataset.v].go(ph,from,to);}
document.getElementById('all').addEventListener('click',()=>phones.forEach(ph=>{reset(ph);go(ph,'a');setTimeout(()=>go(ph,'v'),T(1500));}));
document.getElementById('reset').addEventListener('click',()=>phones.forEach(reset));
const spd=document.getElementById('spd'),o=document.getElementById('o-spd');spd.addEventListener('input',()=>{K=+spd.value;o.textContent=K.toFixed(1)+'배';});
</script>
