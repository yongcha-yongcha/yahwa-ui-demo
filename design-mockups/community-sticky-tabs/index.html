<meta charset="utf-8">
<title>익명 이야기 고정 탭</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@font-face{font-family:'Pretendard';src:url('PretendardVariable.woff2') format('woff2');font-weight:100 900;font-display:swap}
/* 레이아웃: 머리(바뀌는 점) → 스크롤 전 · S1~S3 스크롤 뒤 */
:root{--page:#F3F5F7;--ink:#1F2328;--ink-2:#5B636B;--line:#DDE2E7;--chip:#E9EDF1;--tag-new:#377398;--sans:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#14171A;--ink:#EEF1F4;--ink-2:#A3ACB5;--line:#2C3238;--chip:#262C32;--tag-new:#8CC0DF;color-scheme:dark}}
:root[data-theme="dark"]{--page:#14171A;--ink:#EEF1F4;--ink-2:#A3ACB5;--line:#2C3238;--chip:#262C32;--tag-new:#8CC0DF;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 56px}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:28px}
h1{font:700 22px/1.35 var(--sans);margin:0 0 6px;text-wrap:balance}
ul{margin:0;padding-left:18px;color:var(--ink-2);display:grid;gap:4px;max-width:78ch}
ul b{color:var(--ink);font-weight:600}
section{display:grid;gap:12px}
h2{font:700 18px/1.4 var(--sans);margin:0}
.row{display:grid;grid-template-columns:repeat(4,minmax(0,240px));gap:20px}
figure{margin:0;display:grid;gap:8px;min-width:0;align-content:start}
figure img{width:100%;border-radius:20px;border:1px solid var(--line);display:block;background:#fff}
figcaption{font-size:13px;color:var(--ink-2)}
figcaption b{color:var(--ink)}
.tag{font:600 11px/1 var(--sans);padding:5px 8px;border-radius:6px;background:var(--chip);color:var(--ink-2);margin-right:6px}
.tag.new{background:var(--tag-new);color:#fff}
@media (max-width:900px){.row{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
<div class="wrap">
  <header>
    <h1>익명 이야기 · 전체 / 공감순 / 내 글 위에 고정</h1>
    <ul>
      <li><b>지금:</b> 스크롤하면 탭도 같이 올라가서, 아래에서 다른 탭으로 가려면 맨 위까지 다시 올라가야 해요.</li>
      <li><b>모든 안 공통:</b> 스크롤 전에는 지금 그대로. 탭이 위에 닿으면 그 자리에 멈추고, 아래 글이 탭 뒤로 지나가요. 탭을 누르면 그 탭의 맨 위부터 보여요.</li>
      <li>세 장 모두 같은 위치(스크롤 900)에서 찍었어요.</li>
    </ul>
  </header>
  <section><h2>스크롤 전 · 뒤</h2>
    <div class="row">
    <figure><img src="img/T0.jpg" alt="스크롤 전"><figcaption><span class="tag">스크롤 전</span>지금과 같아요</figcaption></figure>
    <figure><img src="img/S1.jpg" alt="S1"><figcaption><span class="tag new">S1</span><b>탭만 고정</b> · 흰 바탕 탭 줄 + 아래 옅은 선 한 줄. 가장 가벼워요</figcaption></figure>
    <figure><img src="img/S2.jpg" alt="S2"><figcaption><span class="tag new">S2</span><b>작은 제목 + 탭</b> · 탭 위에 "익명 이야기"와 가이드 · 알림 아이콘이 같이 붙어요. 어느 화면인지, 알림까지 바로 닿아요</figcaption></figure>
    <figure><img src="img/S3.jpg" alt="S3"><figcaption><span class="tag new">S3</span><b>탭만 고정 · 흐림</b> · 반투명 흰 바탕 + 흐림, 선 대신 아래로 옅은 그림자. 머리 줄 흐림과 같은 결</figcaption></figure>
  </div></section>
</div>
